const ymOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const sameYM = (s,ym) => { const d=parseDate(s); return d?ymOf(d)===ym:false; };

const shiftYM = (ym,delta) => { const [y,m]=ym.split("-").map(Number); return ymOf(new Date(y,m-1+delta,1)); };

/* ============================ CALC ============================ */
function calcImovel(im, visitas, propostas, ref, ym) {
  const disp = parseDate(im.dataDisponibilizacao);
  const desembolso = parseDate(im.dataVenda);
  const compromisso = parseDate(im.dataPropostaAceita);
  const fimMercado = desembolso || ref;
  const mercadoMeses = monthsBetween(fimMercado, disp) || 0;
  const visIm = visitas.filter(v => v.imovelId === im.id);
  const propIm = propostas.filter(p => p.imovelId === im.id);
  const sumRow = r => r ? ((Number(r.qa)||0)+(Number(r.corretor)||0)+(Number(r.direto)||0)) : 0;
  const visMes = sumRow(visIm.find(v => v.ym === ym));
  const propMes = propIm.filter(p => sameYM(p.data, ym)).length;
  // recência de visita em meses: meses consecutivos sem visita a partir do mês selecionado,
  // limitado ao início oficial (maio/2026) e à disponibilização do imóvel.
  const dispYM = disp ? ymOf(disp) : null;
  let mesesSemVisita = 0, cur = ym;
  for (let n=0; n<24; n++) {
    if (sumRow(visIm.find(v => v.ym === cur)) > 0) break;
    mesesSemVisita++;
    const prev = shiftYM(cur, -1);
    if (prev < OFFICIAL_START || (dispYM && prev < dispYM)) break;
    cur = prev;
  }
  const ultProp = propIm.length ? new Date(Math.max(...propIm.map(p => parseDate(p.data)))) : null;
  const diasSemProposta = daysBetween(ref, ultProp || disp);
  const disponivel = im.status === "Disponível";
  const controlado = ym >= OFFICIAL_START; // jan–abr fora do controle: sem flags/saúde
  const necessitaDisparo = controlado && disponivel && mesesSemVisita >= 1;
  const necessitaRevisao = controlado && disponivel && diasSemProposta > 45;
  const atencaoMaxima = controlado && disponivel && (mesesSemVisita >= 2 || diasSemProposta > 60);
  // Saúde reflete a aba Revisão: vermelho = atenção máxima; amarelo = disparo ou revisão de preço; verde = em dia.
  let saude = "neutro";
  if (disponivel && controlado) {
    if (atencaoMaxima) saude = "vermelho";
    else if (necessitaDisparo || necessitaRevisao) saude = "amarelo";
    else saude = "verde";
  }
  const temCompromisso = !!compromisso;
  let bonusVenda = 0, bonusDias = null, bonusMeses = null;
  if (compromisso && disp) {
    bonusDias = Math.floor((compromisso - disp)/86400000);
    bonusMeses = monthsBetween(compromisso, disp);
    if (bonusDias < 90) bonusVenda = 2000;
    else if (bonusDias <= 180) bonusVenda = 1500;
    else if (bonusDias <= 365) bonusVenda = 1000;
    else bonusVenda = 500;
  }
  return { mercadoMeses, mesesSemVisita, diasSemProposta, visMes, propMes, saude, necessitaDisparo, necessitaRevisao, atencaoMaxima, bonusVenda, bonusDias, bonusMeses, temCompromisso };
}

function ymStringOf(dateString) {
  return dateString ? dateString.slice(0,7) : null;
}
function isSaleFlowVisit(im, ym) {
  // Só contam como visitas em fluxo de venda os imóveis "Em processo de venda" ou "Vendido".
  if (!im) return false;
  if (im.status === "Em processo de venda") return true;
  if (im.status === "Vendido") {
    const vendaYM = ymStringOf(im.dataVenda);
    return !vendaYM || ym <= vendaYM;
  }
  return false;
}
function wasAvailableAtStartOfMonth(im, ym) {
  const dispYM = ymStringOf(im.dataDisponibilizacao);
  if (dispYM && ym < dispYM) return false;
  const vendaYM = ymStringOf(im.dataVenda);
  if (vendaYM && ym > vendaYM) return false;
  const propostaYM = ymStringOf(im.dataPropostaAceita);
  if (propostaYM && ym > propostaYM) return false;
  return true;
}
function isActiveInMonth(im, ym) {
  const vendaYM = ymStringOf(im.dataVenda);
  const propostaYM = ymStringOf(im.dataPropostaAceita);
  if (vendaYM && ym > vendaYM) return false;
  if (propostaYM && ym > propostaYM) return false;
  return true;
}
function isDesembolsadoByMonth(im, ym) {
  const vendaYM = ymStringOf(im.dataVenda);
  return vendaYM ? ym >= vendaYM : false;
}

function calcMetas(imoveis, visitas, propostas, config, ref, ym) {
  // Meses anteriores a maio/2026 ficam zerados (controle oficial só a partir de maio).
  if (ym < OFFICIAL_START) {
    return {
      estoque:0, metaVisitas:0, visitasRealizadas:0, porCanal:{QA:0,Corretor:0,Direto:0}, foraQA:0, pctFora:0,
      propostasRecebidas:0, metaPropostas:0, compromissosMes:[], vendasMes:0, desembolsosMes:0,
      trimestre:quarterOf(Number(ym.split("-")[1])-1), metaVendas:0, semVisitaMes:0,
      okVisitas:false, okCanais:false, okConversao:false, okSaude:false, okVendas:false,
      orcamentoTri:Number(config.orcamentoTrimestre)||0, custoOpTri:Number(config.custoOperacionalTrimestre)||0, multiplicador:1,
      bonusVendasMes:0, mesPrograma:Number(config.mesPrograma)||1,
      itensFunil:[
        { label:"Visitas", detalhe:"—", ok:false, valor:0 },
        { label:"Canais (% fora QA)", detalhe:"—", ok:false, valor:0 },
        { label:"Conversão V→P", detalhe:"—", ok:false, valor:0 },
        { label:"Saúde (visita no mês)", detalhe:"—", ok:false, valor:0 },
      ],
      bonusFunil:0, bonusTotal:0, tempoMedio:0, convVP:0,
      visitasFluxo:0, ativos:[], contratoAssinado:[], emProcessoVenda:[], propostaAndamento:[], aVenda:[], emReforma:[], desembolsados:[],
      faixasCounts:[
        { label:"Até 3m", count:0, color:"#1E8A50" },
        { label:"3 – 6m", count:0, color:"#E8921A" },
        { label:"6 – 9m", count:0, color:"#D06010" },
        { label:"9 – 12m", count:0, color:"#C04010" },
        { label:"12m+", count:0, color:"#BC3726" },
      ],
    };
  }
  const sumRow = r => r ? ((Number(r.qa)||0)+(Number(r.corretor)||0)+(Number(r.direto)||0)) : 0;
  const estoque = imoveis.filter(i => i.status === "Disponível" && wasAvailableAtStartOfMonth(i, ym)).length;
  const metaVisitas = estoque * 3;
  const visMesRows = visitas.filter(v => v.ym === ym);
  const porCanal = {
    QA: visMesRows.reduce((s,r)=>s+(Number(r.qa)||0),0),
    Corretor: visMesRows.reduce((s,r)=>s+(Number(r.corretor)||0),0),
    Direto: visMesRows.reduce((s,r)=>s+(Number(r.direto)||0),0),
  };
  const visitasRealizadas = porCanal.QA + porCanal.Corretor + porCanal.Direto;
  const visitasFluxo = visMesRows.reduce((s,r)=>{
    const im = imoveis.find(i=>i.id===r.imovelId);
    return s + (isSaleFlowVisit(im, ym) ? ((Number(r.qa)||0)+(Number(r.corretor)||0)+(Number(r.direto)||0)) : 0);
  }, 0);
  const foraQA = porCanal.Corretor + porCanal.Direto;
  const pctFora = visitasRealizadas ? Math.round(foraQA/visitasRealizadas*100) : 0;
  const propMes = propostas.filter(p => sameYM(p.data, ym));
  const propostasRecebidas = propMes.length;
  const metaPropostas = Math.ceil(metaVisitas * 0.12);
  const compromissosMes = imoveis.filter(i => sameYM(i.dataPropostaAceita, ym));
  const vendasMes = compromissosMes.length;
  const desembolsosMes = imoveis.filter(i => sameYM(i.dataVenda, ym)).length;
  const trimestre = quarterOf(Number(ym.split("-")[1])-1);
  const metaVendas = trimestre === "Q2" ? 3 : trimestre === "Q3" ? 4 : 3;
  const semVisitaMes = imoveis.filter(i => i.status === "Disponível" && sumRow(visitas.find(v => v.imovelId===i.id && v.ym===ym)) === 0).length;
  const okVisitas = metaVisitas > 0 && visitasRealizadas >= metaVisitas;
  const okCanais = pctFora >= 30;
  const okConversao = metaPropostas > 0 && propostasRecebidas >= metaPropostas;
  const okSaude = semVisitaMes === 0;
  const okVendas = vendasMes >= metaVendas;
  // Trava de eficiência (trimestral): custo operacional controlável (bônus corretores + fotos + reformas) vs orçamento do programa.
  const orcamentoTri = Number(config.orcamentoTrimestre)||0;
  const custoOpTri = Number(config.custoOperacionalTrimestre)||0;
  let multiplicador = 1;
  if (orcamentoTri > 0) {
    if (custoOpTri <= orcamentoTri) multiplicador = 1;
    else if (custoOpTri <= orcamentoTri * 1.2) multiplicador = 0.5;
    else multiplicador = 0;
  }
  const bonusVendasMes = compromissosMes.reduce((s,i) => s + calcImovel(i, visitas, propostas, ref, ym).bonusVenda, 0);
  const mesPrograma = Number(config.mesPrograma)||1;
  const itensFunil = [
    { label: "Visitas", detalhe: `${visitasRealizadas} / meta ${metaVisitas}`, ok: okVisitas },
    { label: "Canais (% fora QA)", detalhe: `${pctFora}% / meta 30%`, ok: okCanais },
    { label: "Conversão V→P", detalhe: `${propostasRecebidas} propostas / meta ${metaPropostas}`, ok: okConversao },
    { label: "Saúde (visita no mês)", detalhe: `${semVisitaMes} imóveis s/ visita no mês`, ok: okSaude },
  ];
  let bonusFunil = 0;
  if (mesPrograma <= 2) {
    itensFunil.forEach(it => { it.valor = it.ok ? 500 : 0; });
    bonusFunil = itensFunil.reduce((s,it) => s + it.valor, 0);
  } else {
    const todosOk = itensFunil.every(it => it.ok);
    itensFunil.forEach(it => { it.valor = todosOk ? 500 : 0; });
    bonusFunil = todosOk ? 2000 : 0;
  }
  const bonusTotal = Math.round((bonusVendasMes + bonusFunil) * multiplicador);
  const disponiveis = imoveis.filter(i => i.status === "Disponível");
  const tempoMedio = disponiveis.length
    ? Math.round(disponiveis.reduce((s,i) => s + (calcImovel(i, visitas, propostas, ref, ym).mercadoMeses || 0), 0) / disponiveis.length * 10) / 10
    : 0;
  const convVP = visitasRealizadas ? Math.round(propostasRecebidas/visitasRealizadas*100) : 0;
  const ativos = imoveis.filter(i => isActiveInMonth(i, ym) && !isDesembolsadoByMonth(i, ym));
  const propAndamentoIds = new Set(propostas.filter(p => p.status === "Em negociação" && parseDate(p.data) <= ref).map(p => p.imovelId));
  const contratoAssinado = ativos.filter(i => i.status === "Contrato assinado");
  const emProcessoVenda = ativos.filter(i => ["Proposta aceita", "Em processo de venda"].includes(i.status));
  const indisponiveis = ativos.filter(i => i.status === "Indisponível");
  const propostaAndamento = ativos.filter(i => !i.dataPropostaAceita && propAndamentoIds.has(i.id));
  const emReforma = ativos.filter(i => i.status === "Em reforma");
  const aVenda = ativos.filter(i => i.status === "Disponível" && !propAndamentoIds.has(i.id));
  const desembolsados = imoveis.filter(i => isDesembolsadoByMonth(i, ym));
  const faixas = [
    { label: "Até 3m", min: -1, max: 3, color: "#1E8A50" },
    { label: "3 – 6m", min: 3, max: 6, color: "#E8921A" },
    { label: "6 – 9m", min: 6, max: 9, color: "#D06010" },
    { label: "9 – 12m", min: 9, max: 12, color: "#C04010" },
    { label: "12m+", min: 12, max: 9999, color: "#BC3726" },
  ];
  const faixasCounts = faixas.map(f => ({
    ...f,
    count: ativos.filter(i => {
      const m = calcImovel(i, visitas, propostas, ref, ym).mercadoMeses;
      return m > f.min && m <= f.max;
    }).length,
  }));
  return {
    estoque, metaVisitas, visitasRealizadas, visitasFluxo, porCanal, foraQA, pctFora,
    propostasRecebidas, metaPropostas, compromissosMes, vendasMes, desembolsosMes,
    trimestre, metaVendas, semVisitaMes, okVisitas, okCanais, okConversao, okSaude, okVendas,
    orcamentoTri, custoOpTri, multiplicador, bonusVendasMes, mesPrograma, itensFunil, bonusFunil, bonusTotal,
    tempoMedio, convVP, ativos, contratoAssinado, emProcessoVenda, indisponiveis, propostaAndamento, aVenda, emReforma, desembolsados, faixasCounts,
  };
}

}

/* ============================ FORM MODAL ============================ */
function FormModal({ type, initial, onClose, onSave, imoveis }) {
  const [data, setData] = useState(() => ({ ...(initial || defaults(type)) }));
  const [err, setErr] = useState({});
  const set = (k,v) => setData(d => ({ ...d, [k]:v }));
  const titles = { imovel:"Imóvel", proposta:"Proposta" };
  const isEdit = !!(initial && initial.id);

  function validate() {
    const e = {};
    if (type==="imovel") {
      if (!data.nome?.trim()) e.nome = true;
    } else if (type==="proposta") {
      if (!data.imovelId) e.imovelId = true;
      if (!data.data) e.data = true;
      if (!(Number(data.valorOfertado)>0)) e.valorOfertado = true;
    }
    setErr(e);
    return Object.keys(e).length === 0;
  }
  function submit() {
    if (!validate()) return;
    const out = { ...data };
    if (!out.id) out.id = uid();
    ["valorAnunciado","vendaDireta","valorOfertado","valorAprovado"].forEach(k => { if (k in out) out[k] = Number(out[k])||0; });
    onSave(out);
  }
  const errStyle = k => err[k] ? { ...inputStyle, border:`1px solid ${C.red}` } : inputStyle;

  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4" style={{ background:"rgba(8,53,69,.45)" }} onClick={onClose}>
      <div className="w-full md:max-w-2xl rounded-t-2xl md:rounded-2xl max-h-[92vh] overflow-y-auto scroll-soft" style={{ background:C.card }} onClick={e=>e.stopPropagation()}>

          <h3 className="text-lg font-bold" style={{ color:C.ink }}>{isEdit?"Editar":"Novo"} {titles[type]}</h3>
          <button onClick={onClose} title="Fechar" aria-label="Fechar" style={{ color:C.muted }}><Ic.x width={20} height={20}/></button>
        </div>
        <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
          {type==="imovel" && <>
            <Field label="Código"><input value={data.codigo} onChange={e=>set("codigo",e.target.value)} className={inputCls} style={inputStyle} placeholder="AM-0000"/></Field>
            <Field label="Nome do prédio" required><input value={data.nome} onChange={e=>set("nome",e.target.value)} className={inputCls} style={errStyle("nome")} /></Field>
            <Field label="Proprietário"><TSelect value={data.proprietario||""} onChange={e=>set("proprietario",e.target.value)}><option value="">—</option>{PROPRIETARIOS.map(x=><option key={x}>{x}</option>)}</TSelect></Field>

            <Field label="Nome do negócio"><input value={data.nomeNegocio||""} onChange={e=>set("nomeNegocio",e.target.value)} className={inputCls} style={inputStyle} placeholder="Nome do proprietário/vendedor"/></Field>
            <Field label="Cliente desistente"><input value={data.clienteDesistente||""} onChange={e=>set("clienteDesistente",e.target.value)} className={inputCls} style={inputStyle} placeholder="Nome do cliente que desistiu"/></Field>
            <div className="md:col-span-2"><Field label="Endereço"><input value={data.endereco||""} onChange={e=>set("endereco",e.target.value)} className={inputCls} style={inputStyle} placeholder="Rua, número"/></Field></div>
            <Field label="Bairro"><input value={data.bairro} onChange={e=>set("bairro",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Cidade"><input value={data.cidade||""} onChange={e=>set("cidade",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Anúncio (data)"><input type="date" value={data.dataDisponibilizacao} onChange={e=>set("dataDisponibilizacao",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Valor anúncio (R$)"><input type="number" value={data.valorAnunciado} onChange={e=>set("valorAnunciado",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Venda direta (R$)"><input type="number" value={data.vendaDireta} onChange={e=>set("vendaDireta",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Canal principal"><TSelect value={data.canalPrincipal} onChange={e=>set("canalPrincipal",e.target.value)}>{CANAIS.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Status"><TSelect value={data.status} onChange={e=>set("status",e.target.value)}>{STATUS_IMOVEL.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Data proposta aceita"><input type="date" value={data.dataPropostaAceita} onChange={e=>set("dataPropostaAceita",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Data de venda (desembolso)"><input type="date" value={data.dataVenda} onChange={e=>set("dataVenda",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <div className="md:col-span-2"><Field label="Observações"><TArea value={data.observacoes} onChange={e=>set("observacoes",e.target.value)}/></Field></div>
          </>}
          {type==="proposta" && <>
            <Field label="Imóvel" required><TSelect value={data.imovelId} onChange={e=>set("imovelId",e.target.value)} style={errStyle("imovelId")}><option value="">Selecione…</option>{imoveis.map(i=><option key={i.id} value={i.id}>{i.nome}</option>)}</TSelect></Field>
            <Field label="Data" required><input type="date" value={data.data} onChange={e=>set("data",e.target.value)} className={inputCls} style={errStyle("data")}/></Field>
            <Field label="Valor ofertado (R$)" required><input type="number" value={data.valorOfertado} onChange={e=>set("valorOfertado",e.target.value)} className={inputCls} style={errStyle("valorOfertado")}/></Field>
            <Field label="Valor aprovado (R$)"><input type="number" value={data.valorAprovado} onChange={e=>set("valorAprovado",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Canal"><TSelect value={data.canal} onChange={e=>set("canal",e.target.value)}>{CANAIS.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Status"><TSelect value={data.status} onChange={e=>set("status",e.target.value)}>{STATUS_PROPOSTA.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Motivo da perda"><TSelect value={data.motivoPerda} onChange={e=>set("motivoPerda",e.target.value)}><option value="">—</option>{MOTIVO_PERDA.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
          </>}
        </div>
        <div className="flex justify-end gap-2 px-5 py-4 sticky bottom-0" style={{ background:C.card, borderTop:`1px solid ${C.line}` }}>
          <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
          <Btn onClick={submit}>{isEdit?"Salvar alterações":"Adicionar"}</Btn>
        </div>
      </div>
    </div>
  );
}

/* ============================ MONTH NAV ============================ */
function MonthNav({ ym, setYm }) {
  const next = shiftYM(ym, 1);
  const prev = shiftYM(ym, -1);
  const canForward = startOf(next) <= todayDate();
  const canBack = prev >= MIN_YM;
  return (
    <div className="flex items-center gap-1 rounded-xl px-1 py-1" style={{ background:C.card, border:`1px solid ${C.line}` }}>
      <button onClick={()=>canBack && setYm(prev)} disabled={!canBack} title="Mês anterior" aria-label="Mês anterior" className="p-1.5 rounded-lg hover:bg-black/5 disabled:opacity-30 disabled:cursor-not-allowed" style={{ color:C.muted }}><Ic.chevL width={18} height={18}/></button>
      <span className="text-[13px] font-semibold px-2 capitalize min-w-[130px] text-center" style={{ color:C.ink }}>{monthLabel(ym)}</span>
      <button onClick={()=>canForward && setYm(next)} disabled={!canForward} title="Próximo mês" aria-label="Próximo mês" className="p-1.5 rounded-lg hover:bg-black/5 disabled:opacity-30 disabled:cursor-not-allowed" style={{ color:C.muted }}><Ic.chevR width={18} height={18}/></button>
    </div>
  );
}

/* ============================ PAINEL ============================ */
function PainelScreen({ imoveis, visitas, propostas, config, refData: ref, ym, anual, setAnual }) {
  const M = useMemo(()=>calcMetas(imoveis, visitas, propostas, config, ref, ym), [imoveis,visitas,propostas,config,ref,ym]);
  const maxFaixa = Math.max(1, ...M.faixasCounts.map(f=>f.count));
  const totalVis = M.porCanal.QA + M.porCanal.Corretor + M.porCanal.Direto;
  const A = useMemo(()=>{
    const months = officialMonths(clampYM(ymOf(todayDate())));
    const rows = months.map(m => {
      const mm = calcMetas(imoveis, visitas, propostas, config, refOf(m), m);
      return { ym:m, visitas:mm.visitasRealizadas, metaVisitas:mm.metaVisitas, propostas:mm.propostasRecebidas, vendas:mm.vendasMes, pctFora:mm.pctFora, bonus:mm.bonusTotal };
    });
    const sum = k => rows.reduce((s,r)=>s+r[k],0);
    return { rows, totVisitas:sum("visitas"), totPropostas:sum("propostas"), totVendas:sum("vendas"), totBonus:sum("bonus") };
  }, [imoveis,visitas,propostas,config]);

  return (

          {[["mes","Mensal"],["ano","Anual"]].map(([k,lab])=>{
            const active = anual ? k==="ano" : k==="mes";
            return <button key={k} onClick={()=>setAnual(k==="ano")} className="px-3.5 py-1.5 rounded-lg text-[13px] font-semibold transition-colors" style={active?{background:C.petrol,color:"#fff"}:{background:"transparent",color:C.muted}}>{lab}</button>;
          })}
        </div>
        <span className="text-[12px]" style={{color:C.muted}}>{anual ? "Consolidado oficial · maio em diante" : "Visão do mês selecionado"}</span>
      </div>

      {anual ? (
      <>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <StatCard label="Visitas no ano" value={A.totVisitas} sub="acumulado desde maio" accent={C.petrol} />
          <StatCard label="Propostas no ano" value={A.totPropostas} sub="acumulado desde maio" accent={C.petrol} />
          <StatCard label="Vendas no ano" value={A.totVendas} sub="acumulado desde maio" accent={C.green} />

          <h3 className="font-bold mb-4" style={{color:C.ink}}>Consolidação mensal</h3>

                <tr style={{ background:C.bg, color:C.subtle }} className="text-left text-[11px] uppercase tracking-wide">

                  <th className="px-3 py-2 font-semibold text-right">Visitas</th>
                  <th className="px-3 py-2 font-semibold text-right">Propostas</th>
                  <th className="px-3 py-2 font-semibold text-right">Vendas</th>

                  <th className="px-3 py-2 font-semibold text-right">Bônus</th>
                </tr>

              <tbody>
                {A.rows.map(r=>(
                  <tr key={r.ym} style={{ borderTop:`1px solid ${C.line}` }}>
                    <td className="px-3 py-2 capitalize font-semibold" style={{color:C.ink}}>{monthLabel(r.ym)}</td>

                  <td className="px-3 py-2 text-right tabular font-bold">{A.totVendas}</td>

      <>
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">

            {M.faixasCounts.map(f => (
              <div key={f.label} className="flex items-center gap-3">

                    {f.count>0 && <span className="text-[11px] font-bold text-white tabular">{f.count}</span>}
                  </div>

        </Card>

        <Card className="p-5">
          <h3 className="font-bold mb-4" style={{color:C.ink}}>Origem das visitas</h3>
          {totalVis === 0 ? <EmptyState icon={<Ic.eye width={20} height={20}/>} title="Sem visitas no mês" hint="Registre visitas para ver a distribuição por canal." /> : <>
            <div className="flex rounded-full overflow-hidden h-3 mb-4" style={{background:C.bg}}>
              <div style={{ width:`${M.porCanal.QA/totalVis*100}%`, background:C.petrol }} />
              <div style={{ width:`${M.porCanal.Corretor/totalVis*100}%`, background:C.amber }} />

            </div>
            {[["QA",C.petrol],["Corretor",C.amber],["Direto",C.green]].map(([k,col])=>(
              <div key={k} className="flex items-center justify-between py-1.5" style={{borderBottom:`1px solid ${C.line}`}}>
                <span className="flex items-center gap-2 text-[13px]" style={{color:C.ink}}><Dot color={col}/>{k}</span>
                <span className="text-[13px] font-semibold tabular" style={{color:C.muted}}>{M.porCanal[k]} ({totalVis?Math.round(M.porCanal[k]/totalVis*100):0}%)</span>
              </div>
            ))}
            <div className="mt-3 text-[12px]" style={{color:M.okCanais?C.green:C.amber}}>
              {M.pctFora}% fora do QA (meta 30%)

          <h3 className="font-bold mb-4" style={{color:C.ink}}>Pipeline da carteira</h3>
          {[
            ["A venda", M.aVenda.length, C.petrol],
            ["Em processo de venda", M.emProcessoVenda.length, C.amber],

            ["Contrato assinado", M.contratoAssinado.length, C.green],
            ["Indisponível", M.indisponiveis.length, C.subtle],
            ["Em reforma", M.emReforma.length, C.yellow],
            ["Desembolsados", M.desembolsados.length, C.muted],

/* ============================ REVISÃO ============================ */
function RevisaoScreen({ imoveis, visitas, propostas, refData: ref, ym, onEdit }) {
  const oficial = ym >= OFFICIAL_START;
  const rows = !oficial ? [] : imoveis.filter(i=>i.status==="Disponível").map(i=>({ im:i, c:calcImovel(i,visitas,propostas,ref,ym) }));
  const disparo = rows.filter(r=>r.c.necessitaDisparo).sort((a,b)=>b.c.mesesSemVisita-a.c.mesesSemVisita);
  const revisao = rows.filter(r=>r.c.necessitaRevisao).sort((a,b)=>b.c.diasSemProposta-a.c.diasSemProposta);
  const atencao = rows.filter(r=>r.c.atencaoMaxima).sort((a,b)=>b.c.mesesSemVisita-a.c.mesesSemVisita);

  function waMsg(im) {
    const anuncio = im.valorAnunciado ? fmtBRL(im.valorAnunciado) : null;
    const vd = im.vendaDireta ? fmtBRL(im.vendaDireta) : null;
    const valores = anuncio ? ` Valor de anúncio ${anuncio}${vd?` (venda direta ${vd})`:""}.` : "";
    return `Olá! Temos uma oportunidade no ${im.nome}${im.bairro?` (${im.bairro})`:""}.${valores} Posso agendar uma visita com seu cliente?`;
  }
  function copyMsg(im) {
    const txt = waMsg(im);
    navigator.clipboard?.writeText(txt).catch(()=>{});
  }
  function waLink(im) {
    return `https://wa.me/?text=${encodeURIComponent(waMsg(im))}`;
  }

  function Section({ title, list, color, kind }) {
    return (
      <Card className="p-5">
        <div className="flex items-center gap-2 mb-4">
          <Dot color={color}/>
          <h3 className="font-bold" style={{color:C.ink}}>{title}</h3>
          <Badge bg={C.bg} fg={C.muted}>{list.length}</Badge>
        </div>
        {list.length===0 ? <EmptyState icon={<Ic.target width={20} height={20}/>} title="Tudo em dia" hint="Nenhum imóvel nesta condição agora." /> :
        <div className="space-y-3">
          {list.map(({im,c})=>{
            return (
              <div key={im.id} className="rounded-xl p-3.5" style={{ border:`1px solid ${C.line}`, background:"#FBFCFD" }}>
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <div className="font-semibold truncate" style={{color:C.ink}}>{im.nome}</div>
                    <div className="text-[12px]" style={{color:C.muted}}>{[im.bairro, im.cidade].filter(Boolean).join(" · ")} · <span style={{fontFamily:mono}}>{im.codigo}</span></div>
                  </div>
                  <button onClick={()=>onEdit(im)} title="Editar imóvel" aria-label="Editar imóvel" className="p-1.5 rounded-lg hover:bg-black/5 shrink-0" style={{color:C.muted}}><Ic.edit width={16} height={16}/></button>
                </div>
                <div className="flex flex-wrap gap-x-5 gap-y-1 mt-2 text-[12px]" style={{color:C.muted}}>
                  <span>{kind==="revisao" ? `Sem proposta há ${c.diasSemProposta}d` : (c.mesesSemVisita>=1 ? `Sem visita há ${c.mesesSemVisita} ${c.mesesSemVisita===1?'mês':'meses'}` : 'Sem visita no mês')}</span>
                  <span>Mercado: {c.mercadoMeses}m</span>
                  {im.valorAnunciado>0 && <span>Anúncio: {fmtBRL(im.valorAnunciado)}</span>}
                  {im.vendaDireta>0 && <span>Venda direta: {fmtBRL(im.vendaDireta)}</span>}
                  {im.clienteDesistente && <span>Cliente desistente: {im.clienteDesistente}</span>}
                </div>
                <div className="flex flex-wrap items-center gap-2 mt-3">
                  <a href={waLink(im)} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1.5 rounded-lg" style={{background:C.greenLight, color:C.green}}><Ic.wa width={14} height={14}/> WhatsApp</a>
                  <button onClick={()=>copyMsg(im)} className="inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1.5 rounded-lg" style={{background:C.petrolLight, color:C.petrol}}><Ic.copy width={14} height={14}/> Copiar mensagem</button>
                </div>
              </div>
            );
          })}
        </div>}
      </Card>
    );
  }

  return (
    <div className="space-y-5">
      <Card className="p-4" style={{ background:C.petrolLight, border:`1px solid ${C.petrol}33` }}>
        <div className="flex items-start gap-3">
          <Ic.alert width={20} height={20} style={{color:C.petrol}} />
          <div className="text-[13px]" style={{color:C.petrolDark}}>
            <b>Rotina de revisão.</b> Disparo de leads para imóveis sem visita no mês. Revisão de preço quando passa de 45 dias sem proposta. Atenção máxima: 2+ meses sem visita ou 60 dias sem proposta.
          </div>
        </div>
      </Card>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">
        <Section title="Necessita disparo (sem visita no mês)" list={disparo} color={C.yellow} kind="disparo" />
        <Section title="Necessita revisão de preço (>45d sem proposta)" list={revisao} color={C.amber} kind="revisao" />
        <Section title="Atenção máxima (2+ meses s/ visita)" list={atencao} color={C.red} kind="disparo" />
      </div>
    </div>
  );
}

/* ============================ IMÓVEIS ============================ */
function ImoveisScreen({ imoveis, visitas, propostas, refData: ref, ym, onNew, onEdit, onDelete }) {
  const [q, setQ] = useState("");
  const [fStatus, setFStatus] = useState("");
  const [fCidade, setFCidade] = useState("");
  const [fProp, setFProp] = useState("");
  const cidades = [...new Set(imoveis.map(i=>i.cidade).filter(Boolean))].sort();
  const list = imoveis.filter(i=>{
    if (fStatus && i.status!==fStatus) return false;
    if (fCidade && i.cidade!==fCidade) return false;
    if (fProp && i.proprietario!==fProp) return false;
    if (q) { const s=(i.nome+" "+(i.bairro||"")+" "+(i.cidade||"")+" "+i.codigo+" "+(i.clienteDesistente||"")+" "+(i.nomeNegocio||"")+" "+(i.endereco||"")).toLowerCase(); if(!s.includes(q.toLowerCase())) return false; }
    return true;
  }).map(i=>({ im:i, c:calcImovel(i,visitas,propostas,ref,ym) }));

  return (
    <div className="space-y-4">
      <div className="flex flex-col md:flex-row md:items-center gap-3">
        <div className="relative flex-1">

/* ============================ VISITAS ============================ */
function VisitasScreen({ imoveis, visitas, ym, setVisitaCount }) {
  const [q, setQ] = useState("");
  const oficial = ym >= OFFICIAL_START;
  const rowOf = id => visitas.find(v => v.imovelId===id && v.ym===ym);
  const sumRow = r => r ? ((Number(r.qa)||0)+(Number(r.corretor)||0)+(Number(r.direto)||0)) : 0;
  const list = imoveis
    .filter(i => i.status !== "Vendido" || (i.dataVenda && ym <= i.dataVenda.slice(0,7)))
    .filter(i => !q || (i.codigo+" "+i.nome+" "+(i.clienteDesistente||"")).toLowerCase().includes(q.toLowerCase()));
  const tot = canal => list.reduce((s,i)=>s+(Number(rowOf(i.id)?.[canal])||0),0);
  const totQA = tot("qa"), totCorretor = tot("corretor"), totDireto = tot("direto");
  const totGeral = totQA + totCorretor + totDireto;

  const numCell = (im, canal) => {
    const row = rowOf(im.id);
    return <input type="number" min="0" value={row ? (Number(row[canal])||0) : 0}
      onChange={e=>setVisitaCount(im.id, ym, canal, e.target.value)}
      className="w-20 rounded-lg px-2 py-1.5 text-[13px] text-right tabular" style={inputStyle} />;
  };

  return (
    <div className="space-y-4">
      <Card className="p-4" style={{ background:C.petrolLight, border:`1px solid ${C.petrol}33` }}>
        <div className="flex items-start gap-3">
          <Ic.eye width={20} height={20} style={{color:C.petrol}} />
          <div className="text-[13px]" style={{color:C.petrolDark}}>
            <b>Visitas por imóvel — {monthLabel(ym)}.</b> Informe os números absolutos de visitas do mês por canal (QA, Corretor, Direto). Use o seletor de mês no topo para trocar o período.
            {!oficial && <span> <b>Atenção:</b> meses anteriores a maio/2026 não entram nos indicadores (controle oficial a partir de maio).</span>}
          </div>
        </div>
      </Card>

      <div className="relative">
        <Ic.search width={16} height={16} style={{ position:"absolute", left:12, top:11, color:C.subtle }} />
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por código, imóvel ou cliente desistente…" className="w-full rounded-lg pl-9 pr-3 py-2.5 text-[13px]" style={inputStyle} />
      </div>

      <Card className="overflow-hidden">
        {list.length===0 ? <EmptyState icon={<Ic.home width={20} height={20}/>} title="Nenhum imóvel" hint="Cadastre imóveis na aba Imóveis para registrar visitas." /> :
        <div className="overflow-x-auto scroll-soft">
          <table className="w-full text-[13px]">
            <thead>
              <tr style={{ background:C.bg, color:C.subtle }} className="text-left text-[11px] uppercase tracking-wide">
                <th className="px-4 py-3 font-semibold">Imóvel</th>
                <th className="px-4 py-3 font-semibold text-center">QA</th>
                <th className="px-4 py-3 font-semibold text-center">Corretor</th>
                <th className="px-4 py-3 font-semibold text-center">Direto</th>
                <th className="px-4 py-3 font-semibold text-right">Total</th>
              </tr>
            </thead>
            <tbody>
              {list.map(im=>{
                const total = sumRow(rowOf(im.id));
                return (
                  <tr key={im.id} className="transition-colors hover:bg-black/[.025]" style={{ borderTop:`1px solid ${C.line}` }}>
                    <td className="px-4 py-3">
                      <div className="font-semibold" style={{color:C.ink}}><span style={{fontFamily:mono}}>{im.codigo}</span> · {im.nome}</div>
                      <div className="text-[12px]" style={{color:C.muted}}>{im.clienteDesistente ? `Cliente desistente: ${im.clienteDesistente}` : (im.bairro||"—")}</div>
                    </td>
                    <td className="px-4 py-3 text-center">{numCell(im,"qa")}</td>
                    <td className="px-4 py-3 text-center">{numCell(im,"corretor")}</td>
                    <td className="px-4 py-3 text-center">{numCell(im,"direto")}</td>
                    <td className="px-4 py-3 text-right tabular font-bold" style={{color:C.ink}}>{total}</td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{ borderTop:`2px solid ${C.line}`, background:C.bg }}>
                <td className="px-4 py-3 font-bold" style={{color:C.ink}}>Total do mês</td>
                <td className="px-4 py-3 text-center tabular font-bold" style={{color:C.ink}}>{totQA}</td>
                <td className="px-4 py-3 text-center tabular font-bold" style={{color:C.ink}}>{totCorretor}</td>
                <td className="px-4 py-3 text-center tabular font-bold" style={{color:C.ink}}>{totDireto}</td>
                <td className="px-4 py-3 text-right tabular font-bold" style={{color:C.petrol}}>{totGeral}</td>
              </tr>
            </tfoot>
          </table>
        </div>}
      </Card>
    </div>
  );
}

                <th className="px-4 py-3 font-semibold">Imóvel</th>
                <th className="px-4 py-3 font-semibold text-right">Ofertado</th>

                    <td className="px-4 py-3 text-right tabular" style={{color:C.muted}}>{p.valorAprovado?fmtBRL(p.valorAprovado):"—"}</td>
                    <td className="px-4 py-3"><Badge bg={C.petrolLight} fg={C.petrol}>{p.canal}</Badge></td>

                    <td className="px-4 py-3">
                      <div className="flex items-center justify-end gap-1">

/* ============================ METAS ============================ */
function MetasScreen({ imoveis, visitas, propostas, config, setConfig, refData: ref, ym }) {
  const M = useMemo(()=>calcMetas(imoveis, visitas, propostas, config, ref, ym), [imoveis,visitas,propostas,config,ref,ym]);
  const set = (k,v) => setConfig(c=>({ ...c, [k]:v }));
  const travaPct = M.orcamentoTri>0 ? Math.round(M.custoOpTri/M.orcamentoTri*100) : 0;
  const travaColor = M.multiplicador===1?C.green:M.multiplicador===0.5?C.yellow:C.red;

  return (
    <div className="space-y-5">
      <Card className="p-5">
        <h3 className="font-bold mb-4" style={{color:C.ink}}>Configuração do programa</h3>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <Field label="Mês do programa"><TInput type="number" min="1" value={config.mesPrograma||1} onChange={e=>set("mesPrograma",e.target.value)} /></Field>
          <Field label="Orçamento operacional do trimestre (R$)"><TInput type="number" value={config.orcamentoTrimestre||0} onChange={e=>set("orcamentoTrimestre",e.target.value)} /></Field>
          <Field label="Custo operacional do trimestre (R$)"><TInput type="number" value={config.custoOperacionalTrimestre||0} onChange={e=>set("custoOperacionalTrimestre",e.target.value)} /></Field>
        </div>
        <div className="text-[12px] mt-3" style={{color:C.muted}}>
          {(M.mesPrograma<=2) ? "Ramp-up: bônus de funil por item cumprido (R$ 500 cada)." : "Maturidade: bônus de funil só com todos os itens cumpridos (R$ 2.000)."}
          {" "}O custo operacional (bônus de corretores + fotos + reformas) vs. orçamento define o multiplicador da trava.
        </div>
      </Card>

      <div>
        <Card className="p-5">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-bold" style={{color:C.ink}}>Trava de eficiência (trimestral)</h3>
            <Badge bg={`${travaColor}1A`} fg={travaColor}>multiplicador {M.multiplicador}×</Badge>
          </div>
          <div className="flex items-end justify-between mb-2">
            <div><div className="text-[12px]" style={{color:C.subtle}}>Custo operacional (trimestre)</div><div className="text-2xl font-bold tabular" style={{color:C.ink}}>{fmtBRL(M.custoOpTri)}</div></div>
            <div className="text-right"><div className="text-[12px]" style={{color:C.subtle}}>Orçamento</div><div className="text-lg font-semibold tabular" style={{color:C.muted}}>{fmtBRL(M.orcamentoTri)}</div></div>
          </div>
          <div className="w-full rounded-full h-4 overflow-hidden relative" style={{ background:C.line }}>
            <div className="h-full rounded-full transition-all" style={{ width:`${Math.min(100,travaPct)}%`, background:travaColor }} />
            {M.orcamentoTri>0 && <div className="absolute top-0 bottom-0" style={{ left:"83.3%", width:2, background:C.muted }} title="120%" />}
          </div>
          <div className="flex justify-between mt-1.5 text-[11px]" style={{color:C.subtle}}>
            <span>{travaPct}% do orçamento</span>
            <span>até 100% → ×1 · até 120% → ×0,5 · acima → ×0</span>
          </div>
        </Card>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card className="p-5">
          <h3 className="font-bold mb-4" style={{color:C.ink}}>Itens do funil</h3>
          <div className="space-y-3">
            {M.itensFunil.map(it=>(
              <div key={it.label} className="flex items-center justify-between rounded-xl p-3" style={{ border:`1px solid ${C.line}`, background:"#FBFCFD" }}>
                <div>
                  <div className="font-semibold text-[13px]" style={{color:C.ink}}>{it.label}</div>
                  <div className="text-[12px]" style={{color:C.muted}}>{it.detalhe}</div>
                </div>
                <Badge bg={it.ok?C.greenLight:C.redLight} fg={it.ok?C.green:C.red}>{it.ok?"OK":"Pendente"}</Badge>
              </div>
            ))}
          </div>
        </Card>

        <Card className="p-5">
          <h3 className="font-bold mb-4" style={{color:C.ink}}>Bônus do mês</h3>
          <div className="space-y-3">
            <div className="rounded-xl p-3" style={{background:C.petrolLight}}>
              <div className="text-[12px]" style={{color:C.petrol}}>Bônus total estimado</div>
              <div className="text-3xl font-bold tabular" style={{color:C.petrolDark}}>{fmtBRL(M.bonusTotal)}</div>
            </div>
            <div className="flex justify-between py-2 text-[13px]" style={{borderBottom:`1px solid ${C.line}`}}><span style={{color:C.muted}}>Bônus por vendas ({M.vendasMes})</span><span className="font-semibold tabular">{fmtBRL(M.bonusVendasMes)}</span></div>
            <div className="flex justify-between py-2 text-[13px]" style={{borderBottom:`1px solid ${C.line}`}}><span style={{color:C.muted}}>Bônus de funil</span><span className="font-semibold tabular">{fmtBRL(M.bonusFunil)}</span></div>
            <div className="flex justify-between py-2 text-[13px]" style={{borderBottom:`1px solid ${C.line}`}}><span style={{color:C.muted}}>Subtotal</span><span className="font-semibold tabular">{fmtBRL(M.bonusVendasMes+M.bonusFunil)}</span></div>
            <div className="flex justify-between py-2 text-[13px]"><span style={{color:C.muted}}>Multiplicador (trava trimestral)</span><span className="font-semibold tabular">× {M.multiplicador}</span></div>
          </div>
        </Card>
      </div>

      <Card className="p-5">
        <h3 className="font-bold mb-4" style={{color:C.ink}}>Metas do mês</h3>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          {[
            ["Visitas", M.visitasRealizadas, M.metaVisitas, M.okVisitas],
            ["Propostas", M.propostasRecebidas, M.metaPropostas, M.okConversao],
            ["Vendas", M.vendasMes, M.metaVendas, M.okVendas],
            ["% fora QA", M.pctFora, 30, M.okCanais],
          ].map(([l,val,max,ok])=>(
            <div key={l}>
              <div className="flex justify-between text-[13px] mb-1.5">
                <span className="font-semibold" style={{color:C.ink}}>{l}</span>
                <span className="tabular" style={{color:ok?C.green:C.amber}}>{val} / {max}</span>
              </div>
              <ProgressBar value={val} max={max} color={ok?C.green:C.amber} />
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============================ RELATÓRIO ============================ */
function RelatorioScreen({ imoveis, visitas, propostas, config, refData: ref, ym }) {
  const M = useMemo(()=>calcMetas(imoveis, visitas, propostas, config, ref, ym), [imoveis,visitas,propostas,config,ref,ym]);
  const oficial = ym >= OFFICIAL_START;
  const vendas = M.compromissosMes.map(i=>({ im:i, c:calcImovel(i,visitas,propostas,ref,ym) }));
  const destaques = !oficial ? [] : imoveis.filter(i=>i.status==="Disponível").map(i=>({im:i,c:calcImovel(i,visitas,propostas,ref,ym)})).filter(r=>r.c.atencaoMaxima).sort((a,b)=>b.c.mesesSemVisita-a.c.mesesSemVisita).slice(0,5);

  return (
    <div className="space-y-5 print-full">
      <div className="flex items-center justify-between no-print">
        <h3 className="font-bold text-lg" style={{color:C.ink}}>Relatório mensal · <span className="capitalize">{monthLabel(ym)}</span></h3>
        <Btn variant="dark" onClick={()=>window.print()}><Ic.print width={16} height={16}/> Imprimir / PDF</Btn>
      </div>

      <Card className="p-6">
        <div className="flex items-center justify-between pb-4 mb-4" style={{borderBottom:`2px solid ${C.petrol}`}}>
          <div>
            <div className="text-2xl font-bold" style={{color:C.petrol}}>aMORA</div>
            <div className="text-[13px]" style={{color:C.muted}}>Relatório de gestão de carteira</div>
          </div>
          <div className="text-right">
            <div className="font-semibold capitalize" style={{color:C.ink}}>{monthLabel(ym)}</div>
            <div className="text-[12px]" style={{color:C.muted}}>Ref. {ref.toLocaleDateString("pt-BR")}</div>
          </div>
        </div>

        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          {[
            ["Estoque ativo", M.estoque],
            ["Visitas no mês", `${M.visitasRealizadas} / ${M.metaVisitas}`],
            ["Propostas", `${M.propostasRecebidas} / ${M.metaPropostas}`],
            ["Vendas", `${M.vendasMes} / ${M.metaVendas}`],
            ["Conversão V→P", `${M.convVP}%`],
            ["% fora QA", `${M.pctFora}%`],
            ["Tempo médio carteira", `${M.tempoMedio}m`],

              <div className="text-xl font-bold tabular mt-0.5" style={{color:C.ink}}>{v}</div>
            </div>
          ))}

        <h4 className="font-bold mb-2" style={{color:C.ink}}>Vendas / Contrato assinado mês</h4>
        {vendas.length===0 ? <div className="text-[13px] mb-5" style={{color:C.muted}}>Nenhuma venda registrada no mês.</div> :
        <table className="w-full text-[13px] mb-6">
          <thead><tr style={{color:C.subtle}} className="text-left text-[11px] uppercase"><th className="py-2">Imóvel</th><th className="py-2 text-center">Tempo</th><th className="py-2 text-right">Anunciado</th><th className="py-2 text-right">Bônus</th></tr></thead>
          <tbody>
            {vendas.map(({im,c})=>(
              <tr key={im.id} style={{borderTop:`1px solid ${C.line}`}}>
                <td className="py-2 font-semibold">{im.nome}</td>
                <td className="py-2 text-center tabular">{c.bonusMeses}m ({c.bonusDias}d)</td>
                <td className="py-2 text-right tabular">{fmtBRL(im.valorAnunciado)}</td>
                <td className="py-2 text-right tabular font-semibold" style={{color:C.green}}>{fmtBRL(c.bonusVenda)}</td>
              </tr>
            ))}
          </tbody>
        </table>}

        <h4 className="font-bold mb-2" style={{color:C.ink}}>Bônus de funil</h4>
        <p className="text-[12px] mb-2" style={{color:C.muted}}>
          {M.mesPrograma<=2
            ? "Ramp-up (meses 1–2 do programa): cada item de funil cumprido no mês paga R$ 500 individualmente."
            : "Maturidade (mês 3+ do programa): o bônus de funil (R$ 2.000) só é pago quando todos os itens são cumpridos no mês."}
        </p>
        <table className="w-full text-[13px] mb-2">
          <thead><tr style={{color:C.subtle}} className="text-left text-[11px] uppercase"><th className="py-2">Item</th><th className="py-2">Resultado</th><th className="py-2 text-center">Status</th><th className="py-2 text-right">Bônus</th></tr></thead>
          <tbody>
            {M.itensFunil.map(it=>(
              <tr key={it.label} style={{borderTop:`1px solid ${C.line}`}}>
                <td className="py-2 font-semibold">{it.label}</td>
                <td className="py-2" style={{color:C.muted}}>{it.detalhe}</td>
                <td className="py-2 text-center font-semibold" style={{color: it.ok?C.green:C.red}}>{it.ok?"Cumprido":"Não cumprido"}</td>
                <td className="py-2 text-right tabular font-semibold" style={{color:C.green}}>{fmtBRL(it.valor)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="flex justify-between text-[13px] mb-6 pt-1" style={{borderTop:`1px solid ${C.line}`}}>
          <span className="font-semibold pt-2" style={{color:C.ink}}>Subtotal funil</span>
          <span className="font-semibold tabular pt-2" style={{color:C.green}}>{fmtBRL(M.bonusFunil)}</span>
        </div>

        <h4 className="font-bold mb-2" style={{color:C.ink}}>Distribuição do tempo em carteira</h4>
        <div className="space-y-2 mb-6">
          {M.faixasCounts.map(f=>(
            <div key={f.label} className="flex items-center gap-3">
              <span className="text-[12px] w-16 text-right" style={{color:C.muted}}>{f.label}</span>
              <div className="flex-1 rounded-full h-5 overflow-hidden" style={{background:C.bg}}>
                <div className="h-full rounded-full flex items-center justify-end pr-2" style={{ width:`${Math.max(4, f.count/Math.max(1,...M.faixasCounts.map(x=>x.count))*100)}%`, background:f.color }}>{f.count>0 && <span className="text-[10px] font-bold text-white">{f.count}</span>}</div>
              </div>
            </div>
          ))}
        </div>

        <h4 className="font-bold mb-2" style={{color:C.ink}}>Atenção máxima</h4>
        {destaques.length===0 ? <div className="text-[13px]" style={{color:C.muted}}>Nenhum imóvel em atenção máxima.</div> :
        <ul className="space-y-1.5">
          {destaques.map(({im,c})=>(
            <li key={im.id} className="flex items-center justify-between text-[13px] rounded-lg px-3 py-2" style={{background:C.redLight}}>
              <span className="font-semibold" style={{color:C.ink}}>{im.nome} <span className="font-normal" style={{color:C.muted}}>· {im.bairro}</span></span>
              <span className="tabular" style={{color:C.red}}>{c.mesesSemVisita}m s/ visita · {c.diasSemProposta}d s/ proposta</span>
            </li>
          ))}
        </ul>}

        <div className="mt-6 pt-4 text-[11px] text-center" style={{borderTop:`1px solid ${C.line}`, color:C.subtle}}>
          Gerado em {new Date().toLocaleString("pt-BR")} · aMORA Gestão de Carteira
        </div>
      </Card>
    </div>
  );
}

/* ============================ APP ============================ */
function App() {
  const [imoveis, setImoveis] = useState(()=>loadLS(KEYS.imoveis, null));
  const [visitas, setVisitas] = useState(()=>loadLS(KEYS.visitas, null));
  const [propostas, setPropostas] = useState(()=>loadLS(KEYS.propostas, null));
  const [config, setConfig] = useState(()=>loadLS(KEYS.config, { mesPrograma:2, orcamentoTrimestre:50000, custoOperacionalTrimestre:0 }));

  // seed once / migra dados antigos
  useEffect(()=>{
    if (imoveis===null || visitas===null || propostas===null) {
      const s = makeSeed();
      setImoveis(s.imoveis); setVisitas(s.visitas); setPropostas(s.propostas);
      return;
    }
    // migração: o antigo "corretor de negócio" passa a ser o cliente desistente do imóvel
    if (imoveis.some(i => i.clienteDesistente===undefined)) {
      const oldCor = loadLS(`amora:${VER}:corretores`, []);
      const nomeById = id => (oldCor.find(c=>c.id===id)||{}).nome || "";
      setImoveis(imoveis.map(i => i.clienteDesistente!==undefined ? i : ({ ...i, clienteDesistente: nomeById(i.corretorId) })));
    }
    // migração: visitas individuais (com data/canalOrigem) -> contagens por imóvel/mês/canal
    if (visitas.length && visitas.some(v => v.ym===undefined)) {
      const agg = {};
      visitas.forEach(v => {
        if (!v.data) return;
        const y = String(v.data).slice(0,7);
        const key = v.imovelId+"|"+y;
        if (!agg[key]) agg[key] = { imovelId: v.imovelId, ym: y, qa: 0, corretor: 0, direto: 0 };
        const ck = v.canalOrigem==="Corretor" ? "corretor" : v.canalOrigem==="Direto" ? "direto" : "qa";
        agg[key][ck]++;
      });
      setVisitas(Object.values(agg));
    }
  }, []);

  const I = imoveis||[], V = visitas||[], P = propostas||[];

  // persist
  useEffect(()=>{ if(imoveis) saveLS(KEYS.imoveis, imoveis); }, [imoveis]);
  useEffect(()=>{ if(visitas) saveLS(KEYS.visitas, visitas); }, [visitas]);
  useEffect(()=>{ if(propostas) saveLS(KEYS.propostas, propostas); }, [propostas]);
  useEffect(()=>{ saveLS(KEYS.config, config); }, [config]);

  const [tab, setTab] = useState("painel");
  const [ym, setYm] = useState(()=>clampYM(ymOf(todayDate())));
  const ref = useMemo(()=>refOf(ym), [ym]);
  const [modal, setModal] = useState(null); // { type, initial }
  const [anual, setAnual] = useState(false);

  function upsert(type, item) {
    const setter = { imovel:setImoveis, proposta:setPropostas }[type];
    setter(list => {
      const arr = list||[];
      const exists = arr.some(x=>x.id===item.id);
      return exists ? arr.map(x=>x.id===item.id?item:x) : [...arr, item];
    });
    setModal(null);
  }
  function remove(type, id) {
    if (!window.confirm("Confirmar exclusão deste registro?")) return;
    if (type==="imovel") {
      setImoveis(l=>l.filter(x=>x.id!==id));
      setVisitas(l=>l.filter(x=>x.imovelId!==id));
      setPropostas(l=>l.filter(x=>x.imovelId!==id));
    } else if (type==="proposta") setPropostas(l=>l.filter(x=>x.id!==id));
  }
  // grade de visitas: contagem absoluta por imóvel/mês/canal
  function setVisitaCount(imovelId, ymv, canal, valor) {
    const n = Math.max(0, Math.floor(Number(valor)||0));
    setVisitas(list => {
      const arr = list||[];
      const idx = arr.findIndex(v => v.imovelId===imovelId && v.ym===ymv);
      if (idx >= 0) { const copy = arr.slice(); copy[idx] = { ...copy[idx], [canal]: n }; return copy; }
      return [...arr, { imovelId, ym:ymv, qa:0, corretor:0, direto:0, [canal]: n }];
    });
  }
  const fileInputRef = useRef(null);
  function exportData() {
    const dump = { ver: VER, exportadoEm: new Date().toISOString(), imoveis: I, visitas: V, propostas: P, config };
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `amora-carteira-${ymOf(todayDate())}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importData(e) {
    const file = e.target.files?.[0];
    e.target.value = ""; // permite reimportar o mesmo arquivo
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.imoveis)) throw new Error("formato");
        if (!window.confirm("Importar substitui todos os dados atuais. Continuar?")) return;
        setImoveis(d.imoveis);
        setVisitas(Array.isArray(d.visitas) ? d.visitas : []);
        setPropostas(Array.isArray(d.propostas) ? d.propostas : []);
        if (d.config) setConfig(d.config);
      } catch { window.alert("Arquivo inválido. Selecione um JSON exportado por esta ferramenta."); }
    };
    r.readAsText(file);
  }

  const tabs = [
    ["painel","Painel",Ic.dash],
    ["revisao","Revisão",Ic.alert],
    ["imoveis","Imóveis",Ic.home],
    ["visitas","Visitas",Ic.eye],
    ["propostas","Propostas",Ic.doc],
    ["metas","Metas & Bônus",Ic.target],
    ["relatorio","Relatório",Ic.report],
  ];

  const showMonthNav = ["revisao","imoveis","visitas","metas","relatorio"].includes(tab) || (tab==="painel" && !anual);

  return (
    <div className="min-h-screen" style={{ background:C.bg }}>
      <header className="sticky top-0 z-30 no-print" style={{ background:C.petrolDark }}>
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center font-black text-white text-lg" style={{ background:C.petrol }}>a</div>
            <div>
              <div className="text-white font-bold leading-tight">aMORA</div>
              <div className="text-[11px]" style={{color:"#9FC3CE"}}>Gestão de Carteira</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {showMonthNav && <MonthNav ym={ym} setYm={setYm} />}
            <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={importData} className="hidden" />
            <button onClick={exportData} title="Exportar dados (JSON)" aria-label="Exportar dados" className="p-2 rounded-lg text-white/80 hover:bg-white/10"><Ic.download width={18} height={18}/></button>
            <button onClick={()=>fileInputRef.current?.click()} title="Importar dados (JSON)" aria-label="Importar dados" className="p-2 rounded-lg text-white/80 hover:bg-white/10"><Ic.upload width={18} height={18}/></button>
          </div>
        </div>
        <nav className="border-t border-white/10">
          <div className="max-w-7xl mx-auto px-2 flex gap-1 overflow-x-auto scroll-soft">
            {tabs.map(([k,label,Icon])=>(
              <button key={k} onClick={()=>setTab(k)} className="flex items-center gap-2 px-3.5 py-3 text-[13px] font-semibold whitespace-nowrap transition-colors" style={{ color: tab===k?"#fff":"#9FC3CE", borderBottom:`2px solid ${tab===k?C.amber:"transparent"}` }}>
                <Icon width={16} height={16}/> {label}
              </button>
            ))}
          </div>
        </nav>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-6">
        {tab==="painel" && <PainelScreen imoveis={I} visitas={V} propostas={P} config={config} refData={ref} ym={ym} anual={anual} setAnual={setAnual} />}
        {tab==="revisao" && <RevisaoScreen imoveis={I} visitas={V} propostas={P} refData={ref} ym={ym} onEdit={im=>setModal({type:"imovel",initial:im})} />}
        {tab==="imoveis" && <ImoveisScreen imoveis={I} visitas={V} propostas={P} refData={ref} ym={ym} onNew={()=>setModal({type:"imovel"})} onEdit={im=>setModal({type:"imovel",initial:im})} onDelete={id=>remove("imovel",id)} />}
        {tab==="visitas" && <VisitasScreen imoveis={I} visitas={V} ym={ym} setVisitaCount={setVisitaCount} />}
        {tab==="propostas" && <PropostasScreen imoveis={I} propostas={P} onNew={()=>setModal({type:"proposta"})} onEdit={p=>setModal({type:"proposta",initial:p})} onDelete={id=>remove("proposta",id)} />}
        {tab==="metas" && <MetasScreen imoveis={I} visitas={V} propostas={P} config={config} setConfig={setConfig} refData={ref} ym={ym} />}
        {tab==="relatorio" && <RelatorioScreen imoveis={I} visitas={V} propostas={P} config={config} refData={ref} ym={ym} />}
      </main>

      {modal && <FormModal type={modal.type} initial={modal.initial} imoveis={I} onClose={()=>setModal(null)} onSave={item=>upsert(modal.type, item)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
