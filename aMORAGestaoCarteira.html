const monthsBetween = (end,start) => (end&&start) ? (end.getFullYear()*12+end.getMonth())-(start.getFullYear()*12+start.getMonth()) : null;
const ymOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const sameYM = (s,ym) => { const d=parseDate(s); return d?ymOf(d)===ym:false; };
const monthLabel = ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); };
const shiftYM = (ym,delta) => { const [y,m]=ym.split("-").map(Number); return ymOf(new Date(y,m-1+delta,1)); };
const quarterOf = m0 => m0<=2?"Q1":m0<=5?"Q2":m0<=8?"Q3":"Q4";
const refOf = ym => { const [y,m]=ym.split("-").map(Number); const end=new Date(y,m,0); end.setHours(0,0,0,0); const t=todayDate(); return end>t?t:end; };

/* ============================ CALC ============================ */
function calcImovel(im, visitas, propostas, ref, ym) {
  const disp = parseDate(im.dataDisponibilizacao);
  const desembolso = parseDate(im.dataVenda);
  const compromisso = parseDate(im.dataPropostaAceita);
  const fimMercado = desembolso || ref;
  const mercadoDias = (disp && fimMercado) ? Math.floor((fimMercado - disp)/86400000) : 0;
  const mercadoMeses = monthsBetween(fimMercado, disp) || 0;
  const carregoAcum = Math.round(im.carregoMensal * (mercadoDias/30));
  const visIm = visitas.filter(v => v.imovelId === im.id);
  const propIm = propostas.filter(p => p.imovelId === im.id);
  const visMes = visIm.filter(v => sameYM(v.data, ym)).length;
  const propMes = propIm.filter(p => sameYM(p.data, ym)).length;
  const ultVisita = visIm.length ? new Date(Math.max(...visIm.map(v => parseDate(v.data)))) : null;
  const ultProp = propIm.length ? new Date(Math.max(...propIm.map(p => parseDate(p.data)))) : null;
  const diasSemVisita = daysBetween(ref, ultVisita || disp);
  const diasSemProposta = daysBetween(ref, ultProp || disp);
  const disponivel = im.status === "Disponível";
  let saude = "neutro";
  if (disponivel) {
    if (diasSemVisita > 60) saude = "vermelho";
    else if (diasSemVisita > 30) saude = "amarelo";
    else saude = "verde";
  }
  const necessitaDisparo = disponivel && diasSemVisita > 30;
  const necessitaRevisao = disponivel && diasSemProposta > 45;
  const atencaoMaxima = disponivel && (diasSemVisita > 60 || diasSemProposta > 60);
  const temCompromisso = !!compromisso;
  let bonusVenda = 0, bonusDias = null, bonusMeses = null;
  if (compromisso && disp) {
    bonusDias = Math.floor((compromisso - disp)/86400000);
    bonusMeses = monthsBetween(compromisso, disp);
    if (bonusDias < 90) bonusVenda = 2000;
    else if (bonusDias <= 180) bonusVenda = 1500;
    else if (bonusDias <= 365) bonusVenda = 1000;
    else bonusVenda = 500;
  }
  return { mercadoMeses, mercadoDias, carregoAcum, diasSemVisita, diasSemProposta, visMes, propMes, saude, necessitaDisparo, necessitaRevisao, atencaoMaxima, bonusVenda, bonusDias, bonusMeses, temCompromisso };
}

function calcMetas(imoveis, visitas, propostas, config, ref, ym) {
  const estoque = imoveis.filter(i => i.status === "Disponível").length;
  const metaVisitas = estoque * 3;
  const visMes = visitas.filter(v => sameYM(v.data, ym));
  const visitasRealizadas = visMes.length;
  const porCanal = { QA: 0, Corretor: 0, Direto: 0 };
  visMes.forEach(v => { if (porCanal[v.canalOrigem] !== undefined) porCanal[v.canalOrigem]++; });
  const foraQA = visMes.filter(v => v.canalOrigem !== "QA").length;
  const pctFora = visitasRealizadas ? Math.round(foraQA/visitasRealizadas*100) : 0;
  const propMes = propostas.filter(p => sameYM(p.data, ym));
  const propostasRecebidas = propMes.length;
  const metaPropostas = Math.ceil(visitasRealizadas * 0.12);
  const compromissosMes = imoveis.filter(i => sameYM(i.dataPropostaAceita, ym));
  const vendasMes = compromissosMes.length;
  const desembolsosMes = imoveis.filter(i => sameYM(i.dataVenda, ym)).length;
  const trimestre = quarterOf(Number(ym.split("-")[1])-1);
  const metaVendas = trimestre === "Q2" ? 3 : trimestre === "Q3" ? 4 : 3;
  const semVisita30 = imoveis.filter(i => {
    if (i.status !== "Disponível") return false;
    const calc = calcImovel(i, visitas, propostas, ref, ym);
    return calc.diasSemVisita > 30;
  }).length;
  const okVisitas = metaVisitas > 0 && visitasRealizadas >= metaVisitas;
  const okCanais = pctFora >= 30;
  const okConversao = metaPropostas > 0 && propostasRecebidas >= metaPropostas;
  const okSaude = semVisita30 === 0;
  const okVendas = vendasMes >= metaVendas;
  const custoCalc = imoveis.filter(i => i.status !== "Vendido").reduce((s,i) => s + (i.carregoMensal||0), 0);
  const budget = Number(config.budgetMes)||0;
  let multiplicador = 1;
  if (budget > 0) {
    if (custoCalc <= budget) multiplicador = 1;
    else if (custoCalc <= budget * 1.2) multiplicador = 0.5;
    else multiplicador = 0;
  }
  const bonusVendasMes = compromissosMes.reduce((s,i) => s + calcImovel(i, visitas, propostas, ref, ym).bonusVenda, 0);
  const mesPrograma = Number(config.mesPrograma)||1;
  const itensFunil = [
    { label: "Visitas", detalhe: `${visitasRealizadas} / meta ${metaVisitas}`, ok: okVisitas },
    { label: "Canais (% fora QA)", detalhe: `${pctFora}% / meta 30%`, ok: okCanais },
    { label: "Conversão V→P", detalhe: `${propostasRecebidas} propostas / meta ${metaPropostas}`, ok: okConversao },
    { label: "Saúde (30d+)", detalhe: `${semVisita30} imóveis s/ visita > 30d`, ok: okSaude },
  ];
  let bonusFunil = 0;
  if (mesPrograma <= 2) {
    bonusFunil = itensFunil.reduce((s,it) => s + (it.ok ? 500 : 0), 0);
  } else {
    bonusFunil = itensFunil.every(it => it.ok) ? 2000 : 0;
  }
  const bonusTotal = Math.round((bonusVendasMes + bonusFunil) * multiplicador);
  const disponiveis = imoveis.filter(i => i.status === "Disponível");
  const tempoMedio = disponiveis.length
    ? Math.round(disponiveis.reduce((s,i) => s + (calcImovel(i, visitas, propostas, ref, ym).mercadoMeses || 0), 0) / disponiveis.length * 10) / 10
    : 0;
  const convVP = visitasRealizadas ? Math.round(propostasRecebidas/visitasRealizadas*100) : 0;
  const ativos = imoveis.filter(i => i.status !== "Vendido");
  const propAndamentoIds = new Set(propostas.filter(p => p.status === "Em negociação" && parseDate(p.data) <= ref).map(p => p.imovelId));
  const contratoAssinado = ativos.filter(i => i.dataPropostaAceita);
  const propostaAndamento = ativos.filter(i => !i.dataPropostaAceita && propAndamentoIds.has(i.id));
  const emReforma = ativos.filter(i => i.status === "Em reforma");
  const aVenda = ativos.filter(i => !i.dataPropostaAceita && !propAndamentoIds.has(i.id) && i.status !== "Em reforma");
  const desembolsados = imoveis.filter(i => i.status === "Vendido");
  const faixas = [
    { label: "Até 3m", min: -1, max: 3, color: "#1E8A50" },
    { label: "3 – 6m", min: 3, max: 6, color: "#E8921A" },
    { label: "6 – 9m", min: 6, max: 9, color: "#D06010" },
    { label: "9 – 12m", min: 9, max: 12, color: "#C04010" },
    { label: "12m+", min: 12, max: 9999, color: "#BC3726" },
  ];
  const faixasCounts = faixas.map(f => ({
    ...f,
    count: ativos.filter(i => {
      const m = calcImovel(i, visitas, propostas, ref, ym).mercadoMeses;
      return m > f.min && m <= f.max;
    }).length,
  }));
  return {
    estoque, metaVisitas, visitasRealizadas, porCanal, foraQA, pctFora,
    propostasRecebidas, metaPropostas, compromissosMes, vendasMes, desembolsosMes,
    trimestre, metaVendas, semVisita30, okVisitas, okCanais, okConversao, okSaude, okVendas,
    custoCalc, budget, multiplicador, bonusVendasMes, mesPrograma, itensFunil, bonusFunil, bonusTotal,
    tempoMedio, convVP, ativos, contratoAssinado, propostaAndamento, aVenda, emReforma, desembolsados, faixasCounts,
  };
}

/* ============================ DEFAULTS ============================ */
function defaults(type) {
  const t = todayDate().toISOString().slice(0,10);
  if (type==="imovel") return { codigo:"", nome:"", bairro:"", regiao:"", dataDisponibilizacao:t, valorAnunciado:0, valorMinimo:0, corretorId:"", canalPrincipal:"QA", status:"Disponível", dataPropostaAceita:"", dataVenda:"", carregoMensal:0, observacoes:"" };
  if (type==="visita") return { data:t, imovelId:"", corretorId:"", cliente:"", canalOrigem:"QA", qualificada:false, checkin:false, feedback:"", interesse:"Médio", proximoPasso:"" };
  if (type==="proposta") return { data:t, imovelId:"", valorOfertado:0, valorAprovado:0, canal:"QA", corretorId:"", status:"Em negociação", motivoPerda:"" };
  return { nome:"", whatsapp:"", regiao:"", especialidade:"", ultimoContato:t, statusRelacionamento:"Novo" };
}

/* ============================ PRIMITIVES ============================ */
function Badge({ children, bg, fg }) {
  return <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold whitespace-nowrap" style={{ background: bg, color: fg }}>{children}</span>;
}
function statusImovelBadge(s) {
  const map = {
    "Disponível": [C.petrolLight, C.petrol],
    "Proposta aceita": [C.greenLight, C.green],
    "Contrato em assinatura": [C.amberLight, C.amber],
    "Vendido": ["#E4E9EE", C.muted],
    "Em reforma": [C.yellowLight, C.yellow],
  };
  const [bg,fg] = map[s] || ["#E4E9EE", C.muted];
  return <Badge bg={bg} fg={fg}>{s}</Badge>;
}
function statusPropostaBadge(s) {
  const map = {
    "Em negociação": [C.amberLight, C.amber],
    "Aceita": [C.greenLight, C.green],
    "Recusada": [C.redLight, C.red],
    "Convertida em venda": [C.petrolLight, C.petrol],
  };
  const [bg,fg] = map[s] || ["#E4E9EE", C.muted];
  return <Badge bg={bg} fg={fg}>{s}</Badge>;
}
function corretorBadge(s) {
  const map = {
    "Ativo": [C.greenLight, C.green],
    "Morno": [C.yellowLight, C.yellow],
    "Inativo": [C.redLight, C.red],
    "Novo": [C.petrolLight, C.petrol],
  };
  const [bg,fg] = map[s] || ["#E4E9EE", C.muted];
  return <Badge bg={bg} fg={fg}>{s}</Badge>;
}
function saudeColor(s) {
  return s==="verde" ? C.green : s==="amarelo" ? C.yellow : s==="vermelho" ? C.red : C.subtle;
}
function Dot({ color }) { return <span className="inline-block rounded-full" style={{ width:9, height:9, background:color }} />; }

function Btn({ children, onClick, variant="primary", size="md", className="", type="button", disabled }) {
  const base = "inline-flex items-center justify-center gap-1.5 font-semibold rounded-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed";
  const sizes = { sm: "text-[12px] px-2.5 py-1.5", md: "text-[13px] px-3.5 py-2", lg: "text-sm px-4 py-2.5" };
  const styles = {
    primary: { background: C.petrol, color: "#fff" },
    dark: { background: C.petrolDark, color: "#fff" },
    soft: { background: C.petrolLight, color: C.petrol },
    ghost: { background: "transparent", color: C.muted, border: `1px solid ${C.line}` },
    danger: { background: C.redLight, color: C.red },
  };
  return <button type={type} disabled={disabled} onClick={onClick} className={`${base} ${sizes[size]} ${className}`} style={styles[variant]}>{children}</button>;
}

function Card({ children, className="", style={} }) {
  return <div className={`rounded-2xl print-block ${className}`} style={{ background: C.card, border: `1px solid ${C.line}`, boxShadow: "0 1px 2px rgba(13,31,48,.04)", ...style }}>{children}</div>;
}

function StatCard({ label, value, sub, accent=C.petrol, semaphore }) {
  return (
    <Card className="p-4 relative overflow-hidden">
      <div className="absolute left-0 top-0 bottom-0" style={{ width:4, background: semaphore || accent }} />
      <div className="pl-2">
        <div className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: C.subtle }}>{label}</div>
        <div className="text-2xl font-bold mt-1 tabular" style={{ color: C.ink }}>{value}</div>
        {sub && <div className="text-[12px] mt-1" style={{ color: C.muted }}>{sub}</div>}
      </div>
    </Card>
  );
}

function Field({ label, children, required }) {
  return (
    <label className="block">
      <span className="text-[12px] font-semibold" style={{ color: C.muted }}>{label}{required && <span style={{color:C.red}}> *</span>}</span>
      <div className="mt-1">{children}</div>
    </label>
  );
}
const inputCls = "w-full rounded-lg px-3 py-2 text-[13px]";
const inputStyle = { border:`1px solid ${C.line}`, background:"#FBFCFD", color:C.ink };

function TInput(props) { return <input {...props} className={inputCls} style={inputStyle} />; }
function TSelect({ children, ...p }) { return <select {...p} className={inputCls} style={inputStyle}>{children}</select>; }
function TArea(props) { return <textarea {...props} rows={3} className={inputCls} style={inputStyle} />; }

function EmptyState({ icon, title, hint }) {
  return (
    <div className="flex flex-col items-center justify-center py-14 text-center">
      <div className="w-12 h-12 rounded-full flex items-center justify-center mb-3" style={{ background: C.petrolLight, color: C.petrol }}>{icon}</div>
      <div className="font-semibold" style={{ color: C.ink }}>{title}</div>
      {hint && <div className="text-[13px] mt-1 max-w-sm" style={{ color: C.muted }}>{hint}</div>}
    </div>
  );
}

function ProgressBar({ value, max, color }) {
  const pct = max>0 ? Math.min(100, Math.round(value/max*100)) : 0;
  return (
    <div className="w-full rounded-full h-2.5 overflow-hidden" style={{ background: C.line }}>
      <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: color }} />
    </div>
  );
}

/* ============================ FORM MODAL ============================ */
function FormModal({ type, initial, onClose, onSave, imoveis, corretores }) {
  const [data, setData] = useState(() => ({ ...(initial || defaults(type)) }));
  const [err, setErr] = useState({});
  const set = (k,v) => setData(d => ({ ...d, [k]:v }));
  const titles = { imovel:"Imóvel", visita:"Visita", proposta:"Proposta", corretor:"Corretor" };
  const isEdit = !!(initial && initial.id);

  function validate() {
    const e = {};
    if (type==="imovel") {
      if (!data.nome?.trim()) e.nome = true;
      if (!data.dataDisponibilizacao) e.dataDisponibilizacao = true;
      if (!(Number(data.valorAnunciado)>0)) e.valorAnunciado = true;
    } else if (type==="visita") {
      if (!data.imovelId) e.imovelId = true;
      if (!data.data) e.data = true;
    } else if (type==="proposta") {
      if (!data.imovelId) e.imovelId = true;
      if (!data.data) e.data = true;
      if (!(Number(data.valorOfertado)>0)) e.valorOfertado = true;
    } else {
      if (!data.nome?.trim()) e.nome = true;
    }
    setErr(e);
    return Object.keys(e).length === 0;
  }
  function submit() {
    if (!validate()) return;
    const out = { ...data };
    if (!out.id) out.id = uid();
    ["valorAnunciado","valorMinimo","carregoMensal","valorOfertado","valorAprovado"].forEach(k => { if (k in out) out[k] = Number(out[k])||0; });
    onSave(out);
  }
  const errStyle = k => err[k] ? { ...inputStyle, border:`1px solid ${C.red}` } : inputStyle;

  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4" style={{ background:"rgba(8,53,69,.45)" }} onClick={onClose}>
      <div className="w-full md:max-w-2xl rounded-t-2xl md:rounded-2xl max-h-[92vh] overflow-y-auto scroll-soft" style={{ background:C.card }} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4 sticky top-0 z-10" style={{ background:C.card, borderBottom:`1px solid ${C.line}` }}>
          <h3 className="text-lg font-bold" style={{ color:C.ink }}>{isEdit?"Editar":"Novo"} {titles[type]}</h3>
          <button onClick={onClose} style={{ color:C.muted }}><Ic.x width={20} height={20}/></button>
        </div>
        <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
          {type==="imovel" && <>
            <Field label="Código"><input value={data.codigo} onChange={e=>set("codigo",e.target.value)} className={inputCls} style={inputStyle} placeholder="AM-0000"/></Field>
            <Field label="Nome" required><input value={data.nome} onChange={e=>set("nome",e.target.value)} className={inputCls} style={errStyle("nome")} /></Field>
            <Field label="Bairro"><input value={data.bairro} onChange={e=>set("bairro",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Região"><input value={data.regiao} onChange={e=>set("regiao",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Data de disponibilização" required><input type="date" value={data.dataDisponibilizacao} onChange={e=>set("dataDisponibilizacao",e.target.value)} className={inputCls} style={errStyle("dataDisponibilizacao")}/></Field>
            <Field label="Carrego mensal (R$)"><input type="number" value={data.carregoMensal} onChange={e=>set("carregoMensal",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Valor anunciado (R$)" required><input type="number" value={data.valorAnunciado} onChange={e=>set("valorAnunciado",e.target.value)} className={inputCls} style={errStyle("valorAnunciado")}/></Field>
            <Field label="Valor mínimo (R$)"><input type="number" value={data.valorMinimo} onChange={e=>set("valorMinimo",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Corretor de negócio"><TSelect value={data.corretorId} onChange={e=>set("corretorId",e.target.value)}><option value="">—</option>{corretores.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</TSelect></Field>
            <Field label="Canal principal"><TSelect value={data.canalPrincipal} onChange={e=>set("canalPrincipal",e.target.value)}>{CANAIS.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Status"><TSelect value={data.status} onChange={e=>set("status",e.target.value)}>{STATUS_IMOVEL.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Data proposta aceita"><input type="date" value={data.dataPropostaAceita} onChange={e=>set("dataPropostaAceita",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Data de venda (desembolso)"><input type="date" value={data.dataVenda} onChange={e=>set("dataVenda",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <div className="md:col-span-2"><Field label="Observações"><TArea value={data.observacoes} onChange={e=>set("observacoes",e.target.value)}/></Field></div>
          </>}
          {type==="visita" && <>
            <Field label="Imóvel" required><TSelect value={data.imovelId} onChange={e=>set("imovelId",e.target.value)} style={errStyle("imovelId")}><option value="">Selecione…</option>{imoveis.map(i=><option key={i.id} value={i.id}>{i.nome}</option>)}</TSelect></Field>
            <Field label="Data" required><input type="date" value={data.data} onChange={e=>set("data",e.target.value)} className={inputCls} style={errStyle("data")}/></Field>
            <Field label="Cliente"><input value={data.cliente} onChange={e=>set("cliente",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Canal de origem"><TSelect value={data.canalOrigem} onChange={e=>set("canalOrigem",e.target.value)}>{CANAIS.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Corretor"><TSelect value={data.corretorId} onChange={e=>set("corretorId",e.target.value)}><option value="">—</option>{corretores.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</TSelect></Field>
            <Field label="Interesse"><TSelect value={data.interesse} onChange={e=>set("interesse",e.target.value)}>{INTERESSE.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <div className="flex items-center gap-5 md:col-span-2">
              <label className="flex items-center gap-2 text-[13px] font-medium" style={{color:C.muted}}><input type="checkbox" checked={data.qualificada} onChange={e=>set("qualificada",e.target.checked)} /> Qualificada</label>
              <label className="flex items-center gap-2 text-[13px] font-medium" style={{color:C.muted}}><input type="checkbox" checked={data.checkin} onChange={e=>set("checkin",e.target.checked)} /> Check-in realizado</label>
            </div>
            <div className="md:col-span-2"><Field label="Feedback"><TArea value={data.feedback} onChange={e=>set("feedback",e.target.value)}/></Field></div>
            <div className="md:col-span-2"><Field label="Próximo passo"><input value={data.proximoPasso} onChange={e=>set("proximoPasso",e.target.value)} className={inputCls} style={inputStyle}/></Field></div>
          </>}
          {type==="proposta" && <>
            <Field label="Imóvel" required><TSelect value={data.imovelId} onChange={e=>set("imovelId",e.target.value)} style={errStyle("imovelId")}><option value="">Selecione…</option>{imoveis.map(i=><option key={i.id} value={i.id}>{i.nome}</option>)}</TSelect></Field>
            <Field label="Data" required><input type="date" value={data.data} onChange={e=>set("data",e.target.value)} className={inputCls} style={errStyle("data")}/></Field>
            <Field label="Valor ofertado (R$)" required><input type="number" value={data.valorOfertado} onChange={e=>set("valorOfertado",e.target.value)} className={inputCls} style={errStyle("valorOfertado")}/></Field>
            <Field label="Valor aprovado (R$)"><input type="number" value={data.valorAprovado} onChange={e=>set("valorAprovado",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Canal"><TSelect value={data.canal} onChange={e=>set("canal",e.target.value)}>{CANAIS.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Corretor"><TSelect value={data.corretorId} onChange={e=>set("corretorId",e.target.value)}><option value="">—</option>{corretores.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</TSelect></Field>
            <Field label="Status"><TSelect value={data.status} onChange={e=>set("status",e.target.value)}>{STATUS_PROPOSTA.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
            <Field label="Motivo da perda"><TSelect value={data.motivoPerda} onChange={e=>set("motivoPerda",e.target.value)}><option value="">—</option>{MOTIVO_PERDA.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
          </>}
          {type==="corretor" && <>
            <Field label="Nome" required><input value={data.nome} onChange={e=>set("nome",e.target.value)} className={inputCls} style={errStyle("nome")}/></Field>
            <Field label="WhatsApp"><input value={data.whatsapp} onChange={e=>set("whatsapp",e.target.value)} className={inputCls} style={inputStyle} placeholder="(11) 90000-0000"/></Field>
            <Field label="Região"><input value={data.regiao} onChange={e=>set("regiao",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Especialidade"><input value={data.especialidade} onChange={e=>set("especialidade",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Último contato"><input type="date" value={data.ultimoContato} onChange={e=>set("ultimoContato",e.target.value)} className={inputCls} style={inputStyle}/></Field>
            <Field label="Status do relacionamento"><TSelect value={data.statusRelacionamento} onChange={e=>set("statusRelacionamento",e.target.value)}>{STATUS_CORRETOR.map(x=><option key={x}>{x}</option>)}</TSelect></Field>
          </>}
        </div>
        <div className="flex justify-end gap-2 px-5 py-4 sticky bottom-0" style={{ background:C.card, borderTop:`1px solid ${C.line}` }}>
          <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
          <Btn onClick={submit}>{isEdit?"Salvar alterações":"Adicionar"}</Btn>
        </div>
      </div>
    </div>
  );
}

/* ============================ MONTH NAV ============================ */
function MonthNav({ ym, setYm }) {
  const next = shiftYM(ym, 1);
  const canForward = startOf(next) <= todayDate();
  return (
    <div className="flex items-center gap-1 rounded-xl px-1 py-1" style={{ background:C.card, border:`1px solid ${C.line}` }}>
      <button onClick={()=>setYm(shiftYM(ym,-1))} className="p-1.5 rounded-lg hover:bg-black/5" style={{ color:C.muted }}><Ic.chevL width={18} height={18}/></button>
      <span className="text-[13px] font-semibold px-2 capitalize min-w-[130px] text-center" style={{ color:C.ink }}>{monthLabel(ym)}</span>
      <button onClick={()=>canForward && setYm(next)} disabled={!canForward} className="p-1.5 rounded-lg hover:bg-black/5 disabled:opacity-30 disabled:cursor-not-allowed" style={{ color:C.muted }}><Ic.chevR width={18} height={18}/></button>
    </div>
  );
}

/* ============================ PAINEL ============================ */
function PainelScreen({ imoveis, visitas, propostas, corretores, ref, ym }) {
  const M = useMemo(()=>calcMetas(imoveis, visitas, propostas, {}, ref, ym), [imoveis,visitas,propostas,ref,ym]);
  const maxFaixa = Math.max(1, ...M.faixasCounts.map(f=>f.count));
  const totalVis = M.porCanal.QA + M.porCanal.Corretor + M.porCanal.Direto;

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Estoque ativo" value={M.estoque} sub={`${imoveis.length} imóveis no total`} accent={C.petrol} />
        <StatCard label="Visitas no mês" value={M.visitasRealizadas} sub={`meta ${M.metaVisitas}`} semaphore={M.okVisitas?C.green:C.amber} />
        <StatCard label="Propostas no mês" value={M.propostasRecebidas} sub={`conversão ${M.convVP}% V→P`} semaphore={M.okConversao?C.green:C.amber} />
        <StatCard label="Vendas no mês" value={M.vendasMes} sub={`meta ${M.metaVendas} · ${M.trimestre}`} semaphore={M.okVendas?C.green:C.amber} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="p-5 lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-bold" style={{color:C.ink}}>Tempo em carteira (imóveis ativos)</h3>
            <span className="text-[12px]" style={{color:C.muted}}>tempo médio {M.tempoMedio} meses</span>
          </div>
          <div className="space-y-3">
            {M.faixasCounts.map(f => (
              <div key={f.label} className="flex items-center gap-3">
                <span className="text-[12px] font-semibold w-16 text-right" style={{color:C.muted}}>{f.label}</span>
                <div className="flex-1 rounded-full h-6 overflow-hidden flex items-center" style={{ background:C.bg }}>
                  <div className="h-full rounded-full flex items-center justify-end pr-2 transition-all" style={{ width:`${Math.max(6, f.count/maxFaixa*100)}%`, background:f.color }}>
                    {f.count>0 && <span className="text-[11px] font-bold text-white tabular">{f.count}</span>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Card>

        <Card className="p-5">
          <h3 className="font-bold mb-4" style={{color:C.ink}}>Origem das visitas</h3>
          {totalVis === 0 ? <EmptyState icon={<Ic.eye width={20} height={20}/>} title="Sem visitas no mês" hint="Registre visitas para ver a distribuição por canal." /> : <>
            <div className="flex rounded-full overflow-hidden h-3 mb-4" style={{background:C.bg}}>
              <div style={{ width:`${M.porCanal.QA/totalVis*100}%`, background:C.petrol }} />
              <div style={{ width:`${M.porCanal.Corretor/totalVis*100}%`, background:C.amber }} />
              <div style={{ width:`${M.porCanal.Direto/totalVis*100}%`, background:C.green }} />
            </div>
            {[["QA",C.petrol],["Corretor",C.amber],["Direto",C.green]].map(([k,col])=>(
              <div key={k} className="flex items-center justify-between py-1.5" style={{borderBottom:`1px solid ${C.line}`}}>
                <span className="flex items-center gap-2 text-[13px]" style={{color:C.ink}}><Dot color={col}/>{k}</span>
                <span className="text-[13px] font-semibold tabular" style={{color:C.muted}}>{M.porCanal[k]} ({totalVis?Math.round(M.porCanal[k]/totalVis*100):0}%)</span>
              </div>
            ))}
            <div className="mt-3 text-[12px]" style={{color:M.okCanais?C.green:C.amber}}>
              {M.pctFora}% fora do QA (meta 30%)
            </div>
          </>}
        </Card>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card className="p-5">
          <h3 className="font-bold mb-4" style={{color:C.ink}}>Pipeline da carteira</h3>
          {[
            ["A venda", M.aVenda.length, C.petrol],
            ["Proposta em andamento", M.propostaAndamento.length, C.amber],
            ["Contrato assinado", M.contratoAssinado.length, C.green],
            ["Em reforma", M.emReforma.length, C.yellow],
            ["Desembolsados", M.desembolsados.length, C.muted],
          ].map(([label,n,col])=>(
            <div key={label} className="flex items-center justify-between py-2" style={{borderBottom:`1px solid ${C.line}`}}>
              <span className="flex items-center gap-2 text-[13px]" style={{color:C.ink}}><Dot color={col}/>{label}</span>
              <span className="text-lg font-bold tabular" style={{color:C.ink}}>{n}</span>
            </div>
          ))}
        </Card>

        <Card className="p-5">
          <h3 className="font-bold mb-3" style={{color:C.ink}}>Bônus estimado do mês</h3>
          <div className="text-3xl font-bold tabular" style={{color:C.petrol}}>{fmtBRL(M.bonusTotal)}</div>
          <div className="mt-3 space-y-1.5 text-[13px]">
            <div className="flex justify-between"><span style={{color:C.muted}}>Bônus por vendas</span><span className="font-semibold tabular">{fmtBRL(M.bonusVendasMes)}</span></div>
            <div className="flex justify-between"><span style={{color:C.muted}}>Bônus de funil</span><span className="font-semibold tabular">{fmtBRL(M.bonusFunil)}</span></div>
            <div className="flex justify-between"><span style={{color:C.muted}}>Multiplicador de budget</span><span className="font-semibold tabular">{M.multiplicador}×</span></div>
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ============================ REVISÃO ============================ */
function RevisaoScreen({ imoveis, visitas, propostas, corretores, ref, ym, onEdit }) {
  const corById = id => corretores.find(c=>c.id===id);
  const rows = imoveis.filter(i=>i.status==="Disponível").map(i=>({ im:i, c:calcImovel(i,visitas,propostas,ref,ym) }));
  const disparo = rows.filter(r=>r.c.necessitaDisparo).sort((a,b)=>b.c.diasSemVisita-a.c.diasSemVisita);
  const revisao = rows.filter(r=>r.c.necessitaRevisao).sort((a,b)=>b.c.diasSemProposta-a.c.diasSemProposta);
  const atencao = rows.filter(r=>r.c.atencaoMaxima).sort((a,b)=>b.c.diasSemVisita-a.c.diasSemVisita);

  function waMsg(im) {
    const lo = fmtBRL(im.valorMinimo);
    const hi = fmtBRL(im.valorAnunciado);
    return `Olá! Temos uma oportunidade no ${im.nome}${im.bairro?` (${im.bairro})`:""}. Faixa de negociação entre ${lo} e ${hi}. Posso agendar uma visita com seu cliente?`;
  }
  function copyMsg(im) {
    const txt = waMsg(im);
    navigator.clipboard?.writeText(txt).catch(()=>{});
  }
  function waLink(im) {
    const c = corById(im.corretorId);
    const phone = (c?.whatsapp||"").replace(/\D/g,"");
    const base = phone ? `https://wa.me/55${phone}` : `https://wa.me/`;
    return `${base}?text=${encodeURIComponent(waMsg(im))}`;
  }

  function Section({ title, list, color, kind }) {
    return (
      <Card className="p-5">
        <div className="flex items-center gap-2 mb-4">
          <Dot color={color}/>
          <h3 className="font-bold" style={{color:C.ink}}>{title}</h3>
          <Badge bg={C.bg} fg={C.muted}>{list.length}</Badge>
        </div>
        {list.length===0 ? <EmptyState icon={<Ic.target width={20} height={20}/>} title="Tudo em dia" hint="Nenhum imóvel nesta condição agora." /> :
        <div className="space-y-3">
          {list.map(({im,c})=>{
            const cor = corById(im.corretorId);
            return (
              <div key={im.id} className="rounded-xl p-3.5" style={{ border:`1px solid ${C.line}`, background:"#FBFCFD" }}>
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <div className="font-semibold truncate" style={{color:C.ink}}>{im.nome}</div>
                    <div className="text-[12px]" style={{color:C.muted}}>{im.bairro} · {im.regiao} · <span style={{fontFamily:mono}}>{im.codigo}</span></div>
                  </div>
                  <button onClick={()=>onEdit(im)} className="p-1.5 rounded-lg hover:bg-black/5 shrink-0" style={{color:C.muted}}><Ic.edit width={16} height={16}/></button>
                </div>
                <div className="flex flex-wrap gap-x-5 gap-y-1 mt-2 text-[12px]" style={{color:C.muted}}>
                  <span>{kind==="revisao" ? `Sem proposta há ${c.diasSemProposta}d` : `Sem visita há ${c.diasSemVisita}d`}</span>
                  <span>Mercado: {c.mercadoMeses}m</span>
                  <span>Carrego acum.: {fmtBRL(c.carregoAcum)}</span>
                  <span>Faixa: {fmtBRL(im.valorMinimo)} – {fmtBRL(im.valorAnunciado)}</span>
                </div>
                <div className="flex flex-wrap items-center gap-2 mt-3">
                  <a href={waLink(im)} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1.5 rounded-lg" style={{background:C.greenLight, color:C.green}}><Ic.wa width={14} height={14}/> {cor?`WhatsApp ${cor.nome.split(" ")[0]}`:"WhatsApp"}</a>
                  <button onClick={()=>copyMsg(im)} className="inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1.5 rounded-lg" style={{background:C.petrolLight, color:C.petrol}}><Ic.copy width={14} height={14}/> Copiar mensagem</button>
                </div>
              </div>
            );
          })}
        </div>}
      </Card>
    );
  }

  return (
    <div className="space-y-5">
      <Card className="p-4" style={{ background:C.petrolLight, border:`1px solid ${C.petrol}33` }}>
        <div className="flex items-start gap-3">
          <Ic.alert width={20} height={20} style={{color:C.petrol}} />
          <div className="text-[13px]" style={{color:C.petrolDark}}>
            <b>Rotina de revisão.</b> Disparo de leads quando passa de 30 dias sem visita. Revisão de preço quando passa de 45 dias sem proposta. Atenção máxima acima de 60 dias.
          </div>
        </div>
      </Card>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">
        <Section title="Necessita disparo (>30d sem visita)" list={disparo} color={C.yellow} kind="disparo" />
        <Section title="Necessita revisão de preço (>45d sem proposta)" list={revisao} color={C.amber} kind="revisao" />
        <Section title="Atenção máxima (>60d)" list={atencao} color={C.red} kind="disparo" />
      </div>
    </div>
  );
}

/* ============================ IMÓVEIS ============================ */
function ImoveisScreen({ imoveis, visitas, propostas, corretores, ref, ym, onNew, onEdit, onDelete }) {
  const [q, setQ] = useState("");
  const [fStatus, setFStatus] = useState("");
  const [fRegiao, setFRegiao] = useState("");
  const corById = id => corretores.find(c=>c.id===id);
  const regioes = [...new Set(imoveis.map(i=>i.regiao).filter(Boolean))].sort();
  const list = imoveis.filter(i=>{
    if (fStatus && i.status!==fStatus) return false;
    if (fRegiao && i.regiao!==fRegiao) return false;
    if (q) { const s=(i.nome+" "+i.bairro+" "+i.codigo).toLowerCase(); if(!s.includes(q.toLowerCase())) return false; }
    return true;
  }).map(i=>({ im:i, c:calcImovel(i,visitas,propostas,ref,ym) }));

  return (
    <div className="space-y-4">
      <div className="flex flex-col md:flex-row md:items-center gap-3">
        <div className="relative flex-1">
          <Ic.search width={16} height={16} style={{ position:"absolute", left:12, top:11, color:C.subtle }} />
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por nome, bairro ou código…" className="w-full rounded-lg pl-9 pr-3 py-2.5 text-[13px]" style={inputStyle} />
        </div>
        <TSelect value={fStatus} onChange={e=>setFStatus(e.target.value)}><option value="">Todos os status</option>{STATUS_IMOVEL.map(x=><option key={x}>{x}</option>)}</TSelect>
        <TSelect value={fRegiao} onChange={e=>setFRegiao(e.target.value)}><option value="">Todas as regiões</option>{regioes.map(x=><option key={x}>{x}</option>)}</TSelect>
        <Btn onClick={onNew}><Ic.plus width={16} height={16}/> Novo imóvel</Btn>
      </div>

      <Card className="overflow-hidden">
        {list.length===0 ? <EmptyState icon={<Ic.home width={20} height={20}/>} title="Nenhum imóvel encontrado" hint="Ajuste os filtros ou cadastre um novo imóvel." /> :
        <div className="overflow-x-auto scroll-soft">
          <table className="w-full text-[13px]">
            <thead>
              <tr style={{ background:C.bg, color:C.subtle }} className="text-left text-[11px] uppercase tracking-wide">
                <th className="px-4 py-3 font-semibold">Imóvel</th>
                <th className="px-4 py-3 font-semibold">Status</th>
                <th className="px-4 py-3 font-semibold text-right">Anunciado</th>
                <th className="px-4 py-3 font-semibold text-center">Mercado</th>
                <th className="px-4 py-3 font-semibold text-right">Carrego acum.</th>
                <th className="px-4 py-3 font-semibold text-center">Saúde</th>
                <th className="px-4 py-3 font-semibold">Corretor</th>
                <th className="px-4 py-3 font-semibold text-right">Ações</th>
              </tr>
            </thead>
            <tbody>
              {list.map(({im,c})=>{
                const cor = corById(im.corretorId);
                return (
                  <tr key={im.id} className="transition-colors hover:bg-black/[.025]" style={{ borderTop:`1px solid ${C.line}` }}>
                    <td className="px-4 py-3">
                      <div className="font-semibold" style={{color:C.ink}}>{im.nome}</div>
                      <div className="text-[12px]" style={{color:C.muted}}>{im.bairro} · {im.regiao} · <span style={{fontFamily:mono}}>{im.codigo}</span></div>
                    </td>
                    <td className="px-4 py-3">{statusImovelBadge(im.status)}</td>
                    <td className="px-4 py-3 text-right tabular font-semibold">{fmtBRL(im.valorAnunciado)}</td>
                    <td className="px-4 py-3 text-center tabular" style={{color:C.muted}}>{c.mercadoMeses}m</td>
                    <td className="px-4 py-3 text-right tabular" style={{color:C.muted}}>{fmtBRL(c.carregoAcum)}</td>
                    <td className="px-4 py-3 text-center">
                      <div className="inline-flex flex-col items-center gap-0.5">
                        <Dot color={saudeColor(c.saude)} />
                        {im.status==="Disponível" && <span className="text-[10px] tabular" style={{color:C.subtle}}>{c.diasSemVisita}d</span>}
                      </div>
                    </td>
                    <td className="px-4 py-3 text-[12px]" style={{color:C.muted}}>{cor?cor.nome:"—"}</td>
                    <td className="px-4 py-3">
                      <div className="flex items-center justify-end gap-1">
                        <button onClick={()=>onEdit(im)} className="p-1.5 rounded-lg hover:bg-black/5" style={{color:C.muted}}><Ic.edit width={16} height={16}/></button>
                        <button onClick={()=>onDelete(im.id)} className="p-1.5 rounded-lg hover:bg-black/5" style={{color:C.red}}><Ic.trash width={16} height={16}/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>}
      </Card>
    </div>
  );
}

/* ============================ VISITAS ============================ */
function VisitasScreen({ imoveis, visitas, corretores, onNew, onEdit, onDelete }) {
  const [q, setQ] = useState("");
  const imById = id => imoveis.find(i=>i.id===id);
  const corById = id => corretores.find(c=>c.id===id);
  const list = [...visitas].sort((a,b)=>parseDate(b.data)-parseDate(a.data)).filter(v=>{
    if(!q) return true;
    const im = imById(v.imovelId);
    const s = ((im?.nome||"")+" "+(v.cliente||"")+" "+v.canalOrigem).toLowerCase();
    return s.includes(q.toLowerCase());
  });
  const interesseColor = i => i==="Alto"?C.green:i==="Médio"?C.yellow:i==="Baixo"?C.amber:C.subtle;

  return (
    <div className="space-y-4">
      <div className="flex flex-col md:flex-row md:items-center gap-3">
        <div className="relative flex-1">
          <Ic.search width={16} height={16} style={{ position:"absolute", left:12, top:11, color:C.subtle }} />
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por imóvel, cliente ou canal…" className="w-full rounded-lg pl-9 pr-3 py-2.5 text-[13px]" style={inputStyle} />
        </div>
        <Btn onClick={onNew}><Ic.plus width={16} height={16}/> Nova visita</Btn>
      </div>
      <Card className="overflow-hidden">
        {list.length===0 ? <EmptyState icon={<Ic.eye width={20} height={20}/>} title="Nenhuma visita registrada" hint="Registre as visitas para acompanhar o funil." /> :
        <div className="overflow-x-auto scroll-soft">
          <table className="w-full text-[13px]">
            <thead>
              <tr style={{ background:C.bg, color:C.subtle }} className="text-left text-[11px] uppercase tracking-wide">
                <th className="px-4 py-3 font-semibold">Data</th>
                <th className="px-4 py-3 font-semibold">Imóvel</th>
                <th className="px-4 py-3 font-semibold">Cliente</th>
                <th className="px-4 py-3 font-semibold">Canal</th>
                <th className="px-4 py-3 font-semibold text-center">Qual.</th>
                <th className="px-4 py-3 font-semibold text-center">Interesse</th>
                <th className="px-4 py-3 font-semibold">Corretor</th>
                <th className="px-4 py-3 font-semibold text-right">Ações</th>
              </tr>
            </thead>
            <tbody>
              {list.map(v=>{
                const im = imById(v.imovelId); const cor = corById(v.corretorId);
                return (
                  <tr key={v.id} className="transition-colors hover:bg-black/[.025]" style={{ borderTop:`1px solid ${C.line}` }}>
                    <td className="px-4 py-3 tabular" style={{color:C.muted}}>{parseDate(v.data)?.toLocaleDateString("pt-BR")}</td>
                    <td className="px-4 py-3 font-semibold" style={{color:C.ink}}>{im?im.nome:"—"}</td>
                    <td className="px-4 py-3" style={{color:C.muted}}>{v.cliente||"—"}</td>
                    <td className="px-4 py-3"><Badge bg={C.petrolLight} fg={C.petrol}>{v.canalOrigem}</Badge></td>
                    <td className="px-4 py-3 text-center">{v.qualificada?<span style={{color:C.green}}>✓</span>:<span style={{color:C.subtle}}>—</span>}</td>
                    <td className="px-4 py-3 text-center"><span className="inline-flex items-center gap-1.5 text-[12px]" style={{color:C.muted}}><Dot color={interesseColor(v.interesse)}/>{v.interesse}</span></td>
                    <td className="px-4 py-3 text-[12px]" style={{color:C.muted}}>{cor?cor.nome:"—"}</td>
                    <td className="px-4 py-3">
                      <div className="flex items-center justify-end gap-1">
                        <button onClick={()=>onEdit(v)} className="p-1.5 rounded-lg hover:bg-black/5" style={{color:C.muted}}><Ic.edit width={16} height={16}/></button>
                        <button onClick={()=>onDelete(v.id)} className="p-1.5 rounded-lg hover:bg-black/5" style={{color:C.red}}><Ic.trash width={16} height={16}/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>}
      </Card>
    </div>
  );
}

/* ============================ PROPOSTAS ============================ */
function PropostasScreen({ imoveis, propostas, corretores, onNew, onEdit, onDelete }) {

  const imById = id => imoveis.find(i=>i.id===id);
  const corById = id => corretores.find(c=>c.id===id);
  const list = [...propostas].sort((a,b)=>parseDate(b.data)-parseDate(a.data)).filter(p=>{
    if(!q) return true;
    const im = imById(p.imovelId);
    return ((im?.nome||"")+" "+p.status+" "+p.canal).toLowerCase().includes(q.toLowerCase());
  });

  return (
    <div className="space-y-4">
      <div className="flex flex-col md:flex-row md:items-center gap-3">

        </div>
        <Btn onClick={onNew}><Ic.plus width={16} height={16}/> Nova proposta</Btn>
      </div>
      <Card className="overflow-hidden">
        {list.length===0 ? <EmptyState icon={<Ic.doc width={20} height={20}/>} title="Nenhuma proposta registrada" hint="Cadastre propostas recebidas para acompanhar a negociação." /> :
        <div className="overflow-x-auto scroll-soft">
          <table className="w-full text-[13px]">
            <thead>
              <tr style={{ background:C.bg, color:C.subtle }} className="text-left text-[11px] uppercase tracking-wide">
                <th className="px-4 py-3 font-semibold">Data</th>
                <th className="px-4 py-3 font-semibold">Imóvel</th>
                <th className="px-4 py-3 font-semibold text-right">Ofertado</th>
                <th className="px-4 py-3 font-semibold text-right">Aprovado</th>
                <th className="px-4 py-3 font-semibold">Canal</th>
                <th className="px-4 py-3 font-semibold">Status</th>
                <th className="px-4 py-3 font-semibold">Motivo perda</th>
                <th className="px-4 py-3 font-semibold text-right">Ações</th>
              </tr>
            </thead>
            <tbody>
              {list.map(p=>{
                const im = imById(p.imovelId);
                return (
                  <tr key={p.id} className="transition-colors hover:bg-black/[.025]" style={{ borderTop:`1px solid ${C.line}` }}>
                    <td className="px-4 py-3 tabular" style={{color:C.muted}}>{parseDate(p.data)?.toLocaleDateString("pt-BR")}</td>
                    <td className="px-4 py-3 font-semibold" style={{color:C.ink}}>{im?im.nome:"—"}</td>

/* ============================ CORRETORES ============================ */
function CorretoresScreen({ corretores, imoveis, visitas, propostas, onNew, onEdit, onDelete }) {
  const [q, setQ] = useState("");
  const ranking = corretores.map(c=>{
    const vis = visitas.filter(v=>v.corretorId===c.id).length;
    const props = propostas.filter(p=>p.corretorId===c.id).length;
    const aceitas = propostas.filter(p=>p.corretorId===c.id && (p.status==="Aceita"||p.status==="Convertida em venda")).length;
    const imc = imoveis.filter(i=>i.corretorId===c.id).length;
    const score = vis*1 + props*3 + aceitas*5;
    return { c, vis, props, aceitas, imc, score };
  }).sort((a,b)=>b.score-a.score);
  const list = ranking.filter(r=> !q || (r.c.nome+" "+r.c.regiao+" "+r.c.especialidade).toLowerCase().includes(q.toLowerCase()));
  const medals = ["🥇","🥈","🥉"];

  function waLink(c) {
    const phone=(c.whatsapp||"").replace(/\D/g,"");
    return phone?`https://wa.me/55${phone}`:`https://wa.me/`;
  }

  return (
    <div className="space-y-4">
      <div className="flex flex-col md:flex-row md:items-center gap-3">
        <div className="relative flex-1">
          <Ic.search width={16} height={16} style={{ position:"absolute", left:12, top:11, color:C.subtle }} />
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar corretor…" className="w-full rounded-lg pl-9 pr-3 py-2.5 text-[13px]" style={inputStyle} />
        </div>
        <Btn onClick={onNew}><Ic.plus width={16} height={16}/> Novo corretor</Btn>
      </div>
      {list.length===0 ? <Card><EmptyState icon={<Ic.users width={20} height={20}/>} title="Nenhum corretor" hint="Cadastre corretores parceiros para acompanhar o relacionamento." /></Card> :
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        {list.map((r, idx)=>(
          <Card key={r.c.id} className="p-4">
            <div className="flex items-start justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0">
                {ranking.indexOf(r)<3 && r.score>0 && <span className="text-lg">{medals[ranking.indexOf(r)]}</span>}
                <div className="min-w-0">
                  <div className="font-bold truncate" style={{color:C.ink}}>{r.c.nome}</div>
                  <div className="text-[12px]" style={{color:C.muted}}>{r.c.regiao||"—"}{r.c.especialidade?` · ${r.c.especialidade}`:""}</div>
                </div>
              </div>
              {corretorBadge(r.c.statusRelacionamento)}
            </div>
            <div className="grid grid-cols-4 gap-2 mt-4 text-center">
              {[["Imóveis",r.imc],["Visitas",r.vis],["Propostas",r.props],["Aceitas",r.aceitas]].map(([l,n])=>(
                <div key={l} className="rounded-lg py-2" style={{background:C.bg}}>
                  <div className="text-lg font-bold tabular" style={{color:C.ink}}>{n}</div>
                  <div className="text-[10px] uppercase tracking-wide" style={{color:C.subtle}}>{l}</div>
                </div>
              ))}
            </div>
            <div className="flex items-center justify-between mt-3 text-[12px]" style={{color:C.muted}}>
              <span>Último contato: {r.c.ultimoContato?parseDate(r.c.ultimoContato)?.toLocaleDateString("pt-BR"):"—"}</span>
              <span className="font-semibold" style={{color:C.petrol}}>score {r.score}</span>
            </div>
            <div className="flex items-center gap-2 mt-3">
              <a href={waLink(r.c)} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1.5 rounded-lg" style={{background:C.greenLight, color:C.green}}><Ic.wa width={14} height={14}/> WhatsApp</a>
              <div className="flex-1"/>

              <button onClick={()=>onDelete(r.c.id)} className="p-1.5 rounded-lg hover:bg-black/5" style={{color:C.red}}><Ic.trash width={16} height={16}/></button>
            </div>
          </Card>
        ))}

    </div>
  );
}

/* ============================ APP ============================ */
function App() {
  const [imoveis, setImoveis] = useState(()=>loadLS(KEYS.imoveis, null));
  const [visitas, setVisitas] = useState(()=>loadLS(KEYS.visitas, null));
  const [propostas, setPropostas] = useState(()=>loadLS(KEYS.propostas, null));
  const [corretores, setCorretores] = useState(()=>loadLS(KEYS.corretores, null));
  const [config, setConfig] = useState(()=>loadLS(KEYS.config, { mesPrograma:2, budgetMes:55000 }));

  // seed once
  useEffect(()=>{
    if (imoveis===null || visitas===null || propostas===null || corretores===null) {
      const s = makeSeed();
      setImoveis(s.imoveis); setVisitas(s.visitas); setPropostas(s.propostas); setCorretores(s.corretores);
    }
  }, []);

  const I = imoveis||[], V = visitas||[], P = propostas||[], Cor = corretores||[];

  // persist
  useEffect(()=>{ if(imoveis) saveLS(KEYS.imoveis, imoveis); }, [imoveis]);
  useEffect(()=>{ if(visitas) saveLS(KEYS.visitas, visitas); }, [visitas]);
  useEffect(()=>{ if(propostas) saveLS(KEYS.propostas, propostas); }, [propostas]);
  useEffect(()=>{ if(corretores) saveLS(KEYS.corretores, corretores); }, [corretores]);
  useEffect(()=>{ saveLS(KEYS.config, config); }, [config]);

  const [tab, setTab] = useState("painel");
  const [ym, setYm] = useState(()=>ymOf(todayDate()));
  const ref = useMemo(()=>refOf(ym), [ym]);
  const [modal, setModal] = useState(null); // { type, initial }

  function upsert(type, item) {
    const setter = { imovel:setImoveis, visita:setVisitas, proposta:setPropostas, corretor:setCorretores }[type];
    setter(list => {
      const arr = list||[];
      const exists = arr.some(x=>x.id===item.id);
      return exists ? arr.map(x=>x.id===item.id?item:x) : [...arr, item];
    });
    setModal(null);
  }
  function remove(type, id) {
    if (!window.confirm("Confirmar exclusão deste registro?")) return;
    if (type==="imovel") {
      setImoveis(l=>l.filter(x=>x.id!==id));
      setVisitas(l=>l.filter(x=>x.imovelId!==id));
      setPropostas(l=>l.filter(x=>x.imovelId!==id));
    } else if (type==="visita") setVisitas(l=>l.filter(x=>x.id!==id));
    else if (type==="proposta") setPropostas(l=>l.filter(x=>x.id!==id));
    else if (type==="corretor") setCorretores(l=>l.filter(x=>x.id!==id));
  }
  function resetData() {
    if (!window.confirm("Restaurar dados de demonstração? Isto substitui os dados atuais.")) return;
    const s = makeSeed();
    setImoveis(s.imoveis); setVisitas(s.visitas); setPropostas(s.propostas); setCorretores(s.corretores);
    setConfig({ mesPrograma:2, budgetMes:55000 });
  }

  const tabs = [
    ["painel","Painel",Ic.dash],
    ["revisao","Revisão",Ic.alert],
    ["imoveis","Imóveis",Ic.home],
    ["visitas","Visitas",Ic.eye],
    ["propostas","Propostas",Ic.doc],
    ["corretores","Corretores",Ic.users],
    ["metas","Metas & Bônus",Ic.target],
    ["relatorio","Relatório",Ic.report],
  ];

  const showMonthNav = ["painel","revisao","imoveis","metas","relatorio"].includes(tab);

  return (
    <div className="min-h-screen" style={{ background:C.bg }}>
      <header className="sticky top-0 z-30 no-print" style={{ background:C.petrolDark }}>
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center font-black text-white text-lg" style={{ background:C.petrol }}>a</div>
            <div>
              <div className="text-white font-bold leading-tight">aMORA</div>
              <div className="text-[11px]" style={{color:"#9FC3CE"}}>Gestão de Carteira</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {showMonthNav && <MonthNav ym={ym} setYm={setYm} />}
            <button onClick={resetData} title="Restaurar demonstração" className="p-2 rounded-lg text-white/80 hover:bg-white/10"><Ic.reset width={18} height={18}/></button>
          </div>
        </div>
        <nav className="border-t border-white/10">
          <div className="max-w-7xl mx-auto px-2 flex gap-1 overflow-x-auto scroll-soft">
            {tabs.map(([k,label,Icon])=>(
              <button key={k} onClick={()=>setTab(k)} className="flex items-center gap-2 px-3.5 py-3 text-[13px] font-semibold whitespace-nowrap transition-colors" style={{ color: tab===k?"#fff":"#9FC3CE", borderBottom:`2px solid ${tab===k?C.amber:"transparent"}` }}>
                <Icon width={16} height={16}/> {label}
              </button>
            ))}
          </div>
        </nav>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-6">
        {tab==="painel" && <PainelScreen imoveis={I} visitas={V} propostas={P} corretores={Cor} ref={ref} ym={ym} />}
        {tab==="revisao" && <RevisaoScreen imoveis={I} visitas={V} propostas={P} corretores={Cor} ref={ref} ym={ym} onEdit={im=>setModal({type:"imovel",initial:im})} />}
        {tab==="imoveis" && <ImoveisScreen imoveis={I} visitas={V} propostas={P} corretores={Cor} ref={ref} ym={ym} onNew={()=>setModal({type:"imovel"})} onEdit={im=>setModal({type:"imovel",initial:im})} onDelete={id=>remove("imovel",id)} />}
        {tab==="visitas" && <VisitasScreen imoveis={I} visitas={V} corretores={Cor} onNew={()=>setModal({type:"visita"})} onEdit={v=>setModal({type:"visita",initial:v})} onDelete={id=>remove("visita",id)} />}
        {tab==="propostas" && <PropostasScreen imoveis={I} propostas={P} corretores={Cor} onNew={()=>setModal({type:"proposta"})} onEdit={p=>setModal({type:"proposta",initial:p})} onDelete={id=>remove("proposta",id)} />}
        {tab==="corretores" && <CorretoresScreen corretores={Cor} imoveis={I} visitas={V} propostas={P} onNew={()=>setModal({type:"corretor"})} onEdit={c=>setModal({type:"corretor",initial:c})} onDelete={id=>remove("corretor",id)} />}
        {tab==="metas" && <MetasScreen imoveis={I} visitas={V} propostas={P} config={config} setConfig={setConfig} ref={ref} ym={ym} />}
        {tab==="relatorio" && <RelatorioScreen imoveis={I} visitas={V} propostas={P} corretores={Cor} config={config} ref={ref} ym={ym} />}
      </main>

      {modal && <FormModal type={modal.type} initial={modal.initial} imoveis={I} corretores={Cor} onClose={()=>setModal(null)} onSave={item=>upsert(modal.type, item)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
